name: KAR-171 isolated focused safety test (temporary)

on:
  push:
    branches:
      - work/KAR-171

permissions:
  contents: read

jobs:
  focused:
    name: KAR-171 W1 regression and fail-closed owner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute W1 timestamp-order RED-GREEN regression and atomic lease negative tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/kar99-atomic-mv3-admission.cjs
          node tests/kar99-p13b-trusted-owner-authority.cjs
          node tests/kar99-p13-native-transaction-closure.cjs
