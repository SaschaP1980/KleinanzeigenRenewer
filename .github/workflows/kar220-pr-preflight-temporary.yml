name: KAR-220 sealed PR preflight (temporary)
on:
  push:
    branches: [work/KAR-220]
    paths: ['.github/workflows/kar220-pr-preflight-temporary.yml']
permissions:
  contents: read
  issues: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 64e5ee831a5a3a425571ad9b4ebffb8819d9fc76
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify final sealed tree and canonical readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            H="$(git ls-remote origin refs/heads/work/KAR-220 | cut -f1)"
            git fetch origin "$H" --no-tags
            T="$(git rev-parse "$H^{tree}")"
            if test "$T" = "a201bd6f8b9dfe19e2a3d5ee1fe62fdc490ef7dc"; then
              git checkout --detach "$H"
              if node scripts/kar-work-pr-preflight.cjs --issue 220 --head-sha "$H"; then
                echo "KAR220_SEALED_HEAD=$H"
                exit 0
              fi
            fi
            sleep 3
          done
          exit 1
