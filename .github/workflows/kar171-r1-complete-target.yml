name: KAR-171 R1 complete authenticated target scan (temporary)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: read
jobs:
  r1_complete_target:
    name: R1 authenticated first-page target full-roster gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused R1 early-target full-roster completeness
        run: node tests/kar171-r1-page-account-continuity.cjs
      - name: Remove disposable CI workflow from intended tree
        run: rm .github/workflows/kar171-r1-complete-target.yml
      - name: Full regression, safety, API, architecture and coverage gates
        run: bash scripts/coverage-gate.sh
