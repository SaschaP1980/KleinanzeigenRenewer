name: KAR-210 checkpoint 32 diagnostic
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ced1f170b376da92f4fd1d4a138d22ec54719a1b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Characterize active commands independently
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 'ced1f170b376da92f4fd1d4a138d22ec54719a1b'
          mkdir -p coverage/raw /tmp/kar210-cp32
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json,os,re,shlex,subprocess,time,pathlib
          script=json.load(open('package.json'))['scripts']['test']
          prefix="export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'; "
          assert script.startswith(prefix)
          commands=script[len(prefix):].split(' && ')
          assert len(commands)==512
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs',NODE_V8_COVERAGE=os.path.abspath('coverage/raw'))
          results=[]
          for idx,c in enumerate(commands,1):
              assert re.fullmatch(r'node (?:--test )?tests/[\w./-]+\.(?:cjs|js|mjs)',c) or c in ('node scripts/v12319-coverage-report.cjs coverage/raw coverage','node scripts/v12319-architecture-audit.cjs'),c
              start=time.monotonic()
              try:
                  p=subprocess.run(shlex.split(c),env=env,capture_output=True,text=True,errors='replace',timeout=150)
                  rc=p.returncode
                  output=p.stdout+'\n'+p.stderr
              except subprocess.TimeoutExpired as e:
                  rc=124
                  output=str(e)
              pathlib.Path('/tmp/kar210-cp32',f'{idx:03d}.log').write_text(output)
              evidence=[s.strip()[:450] for s in output.splitlines() if re.search(r'Error:|AssertionError|not ok |FAIL |MODULE_NOT_FOUND|NOT_EXECUTED',s)][:3]
              row=dict(index=idx,command=c,exitCode=rc,status='PASS' if rc==0 else 'TIMEOUT' if rc==124 else 'FAIL',seconds=round(time.monotonic()-start,3),evidence=evidence)
              results.append(row)
              print('CP32_ROW '+json.dumps(row,ensure_ascii=True),flush=True)
          counts={s:sum(x['status']==s for x in results) for s in ('PASS','FAIL','TIMEOUT')}
          print('CP32_COUNTS '+json.dumps(counts),flush=True)
          pathlib.Path('/tmp/kar210-cp32/results.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(bool(counts['FAIL'] or counts['TIMEOUT']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kar210-cp32-diagnostic
          path: /tmp/kar210-cp32
          retention-days: 14
  actual-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ced1f170b376da92f4fd1d4a138d22ec54719a1b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          test "$(git rev-parse HEAD)" = 'ced1f170b376da92f4fd1d4a138d22ec54719a1b'
          bash scripts/coverage-gate.sh

  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ced1f170b376da92f4fd1d4a138d22ec54719a1b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Exact historical runtime and individually adapted contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 'ced1f170b376da92f4fd1d4a138d22ec54719a1b'
          python3 tests/kar210-baseline-restore.py
          failed=0
          for f in tests/v12312c1-version-release.cjs tests/v12313-version-architecture.cjs tests/v12313c1-version-release.cjs tests/v12313c2-version-release.cjs tests/v12314-version-architecture.cjs tests/v12315-version-architecture.cjs tests/v12316-version-architecture.cjs tests/v12316c1-wiring-version.cjs tests/v12316c2-wiring-version.cjs tests/kar210-kar197-baseline-safety.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP32_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP32_PASS $f"; else echo "CP32_FAIL $f"; failed=1; fi
          done
          exit "$failed"
