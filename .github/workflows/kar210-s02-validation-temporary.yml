name: KAR-210 correction release evidence GREEN
on:
  push:
    branches: ['work/KAR-210']
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  review:
    if: >-
      github.ref == 'refs/heads/work/KAR-210' &&
      github.event.head_commit.message == 'test(KAR-210): retain correction evidence with exact restored runtime contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Historical correction evidence
        run: node tests/v12320c1-version-release.cjs
      - name: Exact restored runtime and historical title correction
        if: always()
        run: node tests/v12322-version-release.cjs
      - name: Title and field safety
        if: always()
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node tests/v12322-title-field-stability.cjs
          node tests/kar132-wearables-attributes.cjs
