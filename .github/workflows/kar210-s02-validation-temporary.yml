name: KAR-210 temporary exact-source baseline D diagnostics
on:
  push:
    branches: ['work/KAR-210']
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
concurrency:
  group: kar210-s02-exact-source-diagnostics
  cancel-in-progress: false
jobs:
  focused-diagnostics:
    if: >-
      github.ref == 'refs/heads/work/KAR-210' &&
      github.event.head_commit.message == 'test(KAR-210): verify historical link closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: 87551c7772909d0f445b674618bbee4a27d105e5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Verify exact source basis
        id: basis
        run: |
          test "$(git rev-parse HEAD)" = '87551c7772909d0f445b674618bbee4a27d105e5'
          git status --short
          node --version
          python3 --version
      - name: Verify historical layout and repaired documentation links
        if: always() && steps.basis.outcome == 'success'
        run: node tests/kar167-file-layout.cjs
