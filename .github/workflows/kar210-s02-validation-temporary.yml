name: KAR-210 checkpoint 34 diagnostic
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Characterize active commands independently
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 'c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2'
          mkdir -p coverage/raw /tmp/kar210-cp34
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json,os,re,shlex,subprocess,time,pathlib
          script=json.load(open('package.json'))['scripts']['test']
          prefix="export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'; "
          assert script.startswith(prefix)
          commands=script[len(prefix):].split(' && ')
          assert len(commands)==512
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs',NODE_V8_COVERAGE=os.path.abspath('coverage/raw'))
          results=[]
          for idx,c in enumerate(commands,1):
              assert re.fullmatch(r'node (?:--test )?tests/[\w./-]+\.(?:cjs|js|mjs)',c) or c in ('node scripts/v12319-coverage-report.cjs coverage/raw coverage','node scripts/v12319-architecture-audit.cjs'),c
              start=time.monotonic()
              try:
                  p=subprocess.run(shlex.split(c),env=env,capture_output=True,text=True,errors='replace',timeout=150)
                  rc=p.returncode
                  output=p.stdout+'\n'+p.stderr
              except subprocess.TimeoutExpired as e:
                  rc=124
                  output=str(e)
              pathlib.Path('/tmp/kar210-cp34',f'{idx:03d}.log').write_text(output)
              evidence=[s.strip()[:450] for s in output.splitlines() if re.search(r'Error:|AssertionError|not ok |FAIL |MODULE_NOT_FOUND|NOT_EXECUTED',s)][:3]
              row=dict(index=idx,command=c,exitCode=rc,status='PASS' if rc==0 else 'TIMEOUT' if rc==124 else 'FAIL',seconds=round(time.monotonic()-start,3),evidence=evidence)
              results.append(row)
              print('CP34_ROW '+json.dumps(row,ensure_ascii=True),flush=True)
          counts={s:sum(x['status']==s for x in results) for s in ('PASS','FAIL','TIMEOUT')}
          print('CP34_COUNTS '+json.dumps(counts),flush=True)
          pathlib.Path('/tmp/kar210-cp34/results.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(bool(counts['FAIL'] or counts['TIMEOUT']))
          PY
      - name: Read actual diagnostic coverage and independent non-regression
        if: always()
        shell: bash
        run: |
          set -e
          node -e 'const s=require("./coverage/coverage-summary.json"),a=require("./coverage/architecture-audit.json"); console.log("CP34_MEASURED "+JSON.stringify({summary:s,audit:a}));'
          for n in 67 258 473 499 512; do
            echo "CP34_CLOSURE_LOG_$n"
            cat "/tmp/kar210-cp34/$n.log"
          done
          node scripts/coverage-no-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kar210-cp34-diagnostic
          path: /tmp/kar210-cp34
          retention-days: 14
  actual-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          test "$(git rev-parse HEAD)" = 'c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2'
          bash scripts/coverage-gate.sh

  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Exact historical runtime and individually adapted contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 'c09d3d7dee6ea9003485415f9dcc9e6ec1a9ecf2'
          python3 tests/kar210-baseline-restore.py
          failed=0
          for f in tests/v150-connection.cjs tests/kar68-native-status-gateway.cjs tests/kar69-native-check.cjs tests/kar-release-repo-archive-contract.cjs tests/storage.cjs tests/images.cjs tests/popup.cjs tests/description.cjs tests/edit.cjs tests/optional-dom-indexeddb.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP34_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP34_PASS $f"; else echo "CP34_FAIL $f"; failed=1; fi
          done
          exit "$failed"
