name: KAR-210 disposition contract GREEN
on:
  push:
    branches: ['work/KAR-210']
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  test:
    if: >-
      github.ref == 'refs/heads/work/KAR-210' &&
      github.event.head_commit.message == 'test(KAR-210): enforce two explicit baseline dispositions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact disposition contract
        run: node tests/kar210-test-disposition-contract.cjs
      - name: Run retained baseline safety evidence
        if: always()
        run: |
          set -e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node tests/v1234-insertion-lock-runtime.cjs
          node tests/v1238-account-session-controller-runtime.cjs
          node tests/v1238-profile-management-controller-runtime.cjs
      - name: Check test ownership
        if: always()
        run: node tests/kar167-test-coverage-closure.cjs
