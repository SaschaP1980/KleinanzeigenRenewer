name: KAR-210 suite separation RED
on:
  push:
    branches: ['work/KAR-210']
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  red:
    if: >-
      github.ref == 'refs/heads/work/KAR-210' &&
      github.event.head_commit.message == 'test(KAR-210): require inactive suite separation and isolate product witness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Active suite separation contract
        run: node tests/kar210-test-disposition-contract.cjs
      - name: Independent product witness against restored runtime
        if: always()
        run: node tests/kar210-trash-template-recovery-coalescing.cjs
