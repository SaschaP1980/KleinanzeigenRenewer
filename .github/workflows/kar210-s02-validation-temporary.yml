name: KAR-210 historical architecture version GREEN
on:
  push:
    branches: ['work/KAR-210']
    paths: ['.github/workflows/kar210-s02-validation-temporary.yml']
permissions:
  contents: read
jobs:
  review:
    if: >-
      github.ref == 'refs/heads/work/KAR-210' &&
      github.event.head_commit.message == 'test(KAR-210): reconcile seven historical architecture version contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explicit major baseline version negatives
        run: node tests/kar210-baseline-version-contract.cjs
      - name: Historical architecture contracts
        if: always()
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          result=0
          node tests/v1231-version-architecture.cjs || result=1
          node tests/v1233-version-architecture.cjs || result=1
          node tests/v1234-version-architecture.cjs || result=1
          node tests/v1235-version-architecture.cjs || result=1
          node tests/v1236-version-architecture.cjs || result=1
          node tests/v1237-version-architecture.cjs || result=1
          node tests/v12311-version-architecture.cjs || result=1
          exit "$result"
      - name: Recheck retained test ownership
        if: always()
        run: node tests/kar167-test-coverage-closure.cjs
