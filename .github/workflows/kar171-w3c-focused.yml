name: KAR-171 W3C temporary prior-worker safety proof

on:
  push:
    branches: [work/KAR-171]

permissions:
  contents: read

jobs:
  focused:
    name: W3C two-worker prior-generation RED GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay origin Web Lock and independent historical owner observers
        shell: bash
        run: |
          set -euo pipefail
          node tests/kar99-p8-adversarial-races.cjs
          node --test tests/kar99-p13-persisted-owner-callback-closure.cjs
          node tests/kar99-p7-integrated-owner-authority.cjs
      - name: Install full test dependencies
        run: npm ci
      - name: Full clean-tree regression, public coverage and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          # This temporary CI workflow is intentionally absent in the final
          # production repository; strict KAR-167 inventory remains unchanged.
          rm .github/workflows/kar171-w3c-focused.yml
          bash scripts/coverage-gate.sh
