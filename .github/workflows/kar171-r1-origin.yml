name: KAR-171 R1 account witness origin continuity (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/kar99-phase4-outcome-reconciliation.cjs
      - src/background/services/additional-owner-observer.js
      - .github/workflows/kar171-r1-origin.yml
permissions:
  contents: read
jobs:
  r1-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: R1 original Worker and P8 token account witness regressions
        run: node tests/kar99-phase4-outcome-reconciliation.cjs

  full-gate:
    name: Full runtime, architecture and public coverage on clean-tree equivalent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci
      - name: Complete safety and quality gates without disposable runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kar171-r1-origin.yml
          bash scripts/coverage-gate.sh
