name: KAR-206 preserve v1.25.36 accepted stable snapshot

on:
  push:
    branches: [work/KAR-206]
    paths:
      - .github/workflows/kar206-v12536-stable-snapshot-temporary.yml

permissions:
  contents: write

concurrency:
  group: kar206-v12536-stable-snapshot
  cancel-in-progress: false

jobs:
  preserve:
    if: >-
      github.repository == 'SaschaP1980/KleinanzeigenRenewer' && startsWith(github.event.head_commit.message, 'release(KAR-206): preserve v1.25.36')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify original archive and publish immutable non-latest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly TARGET='5ffd5eccce564154dca0f51b9229283a9d2dae85'
          readonly MAIN='4d7ae5130730776927748e2517fdf9aadaf098cd'
          readonly TAG='v1.25.36'
          readonly ZIP_NAME='kleinanzeigen-renewal-chrome-v1.25.36.zip'
          readonly SHA='f0aef7f1ac12a6e179e03e5fe741ae3348a82fcdc17f510dbd7fe271a134ef3a'
          readonly BYTES=965790
          readonly ZIP="$RUNNER_TEMP/$ZIP_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '9e10e0c111842ac12a72426f5c95c3ae8a144a8d'
          test "$(git rev-parse HEAD^^)" = "$TARGET"
          test "$(git diff --name-status "$TARGET" HEAD)" = "$(printf 'A\t%s' '.github/workflows/kar206-v12536-stable-snapshot-temporary.yml')"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/work/KAR-206 | cut -f1)" = "$GITHUB_SHA"
          git show "$TARGET:release/$ZIP_NAME" > "$ZIP"
          test "$(wc -c < "$ZIP" | tr -d '[:space:]')" = "$BYTES"
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$SHA"
          unzip -t "$ZIP" >/dev/null
          git show "$TARGET:manifest.json" > "$RUNNER_TEMP/manifest.json"
          unzip -p "$ZIP" manifest.json > "$RUNNER_TEMP/zip-manifest.json"
          cmp "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/zip-manifest.json"
          test "$(jq -r .version "$RUNNER_TEMP/manifest.json")" = '1.25.36'
          test "$(git show "$TARGET:package.json" | jq -r .version)" = '1.25.36'
          test "$(git show "$TARGET:package-lock.json" | jq -r .version)" = '1.25.36'
          test "$(git show "$TARGET:release/release-spec.json" | jq -r .version)" = '1.25.36'
          test "$(git show "$MAIN:manifest.json" | jq -r .key)" = "$(jq -r .key "$RUNNER_TEMP/manifest.json")"
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG" > "$RUNNER_TEMP/tag-probe"
          tag_rc=$?
          release_probe="$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          release_rc=$?
          set -e
          test "$tag_rc" -eq 2
          test "$release_rc" -ne 0
          printf '%s\n' "$release_probe" | grep -Eq 'HTTP/[0-9.]+ 404'
          latest_before="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name)"
          test -n "$latest_before"
          test "$latest_before" != null
          test "$latest_before" != "$TAG"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$TAG" "$TARGET" -m "Kleinanzeigen Manager v1.25.36 — owner-accepted functional stable snapshot" -m "Original archive SHA-256 $SHA; bytes $BYTES; KAR-206; performance follow-up KAR-207. Not merged to main; no updater promotion."
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$tag_object"
          test "$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" = "$TARGET"
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Owner-accepted functional stable snapshot

          v1.25.36 preserves the exact originally built and native-tested Chrome package. The owner accepted restoration of functionality and requested a durable release and closure of KAR-206 on 2026-11-24.

          - Source commit: `5ffd5eccce564154dca0f51b9229283a9d2dae85` (clean Work snapshot)
          - Development path: Work-only preservation; not a merged-main release or updater/latest promotion.
          - Chrome ZIP: `kleinanzeigen-renewal-chrome-v1.25.36.zip`
          - Bytes: 965790
          - SHA-256: `f0aef7f1ac12a6e179e03e5fe741ae3348a82fcdc17f510dbd7fe271a134ef3a`
          - Original ZIP, not rebuilt; [exact source/package CI](https://github.com/SaschaP1980/KleinanzeigenRenewer/actions/runs/45391405935) GREEN, packaged Chromium 9/9.
          - Native standalone/Phase4 recovery accepted on v1.25.35; native one-item Fast Mass Renewal accepted on v1.25.36.
          - Performance remains unsatisfactory: one-item batch 150.448 s, at least 14 workflow tabs; [KAR-207 Critical](https://github.com/SaschaP1980/KleinanzeigenRenewer/issues/207) owns optimization and Fast-3 benchmarking. Historical hardware Gold: reference 61.277 s total / 20.426 s average; old computer 110.340 s total / 36.771 s documented average.
          - Full Safe Mode, ZIP post-click verification and broader KAR-171 R1 acceptance are not certified by this snapshot. No main merge, no live-account action, no updater promotion.

          [KAR-206 evidence](https://github.com/SaschaP1980/KleinanzeigenRenewer/issues/206#issuecomment-7107868171).
          EOF
          jq -n --arg tag "$TAG" --arg target "$TARGET" --rawfile body "$RUNNER_TEMP/notes.md" '{tag_name:$tag,target_commitish:$target,name:"Kleinanzeigen Manager v1.25.36 - Functional Stable Snapshot",body:$body,draft:true,prerelease:false,make_latest:"false",generate_release_notes:false}' > "$RUNNER_TEMP/create.json"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/create.json" > "$RUNNER_TEMP/draft.json"
          release_id="$(jq -r .id "$RUNNER_TEMP/draft.json")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          test "$(jq -r .tag_name "$RUNNER_TEMP/draft.json")" = "$TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/draft.json")" = true
          gh release upload "$TAG" "$ZIP"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > "$RUNNER_TEMP/assets.json"
          jq -e --arg name "$ZIP_NAME" --argjson bytes "$BYTES" --arg digest "sha256:$SHA" 'length==1 and .[0].name==$name and .[0].size==$bytes and .[0].state=="uploaded" and ((.[0].digest // $digest)==$digest)' "$RUNNER_TEMP/assets.json" >/dev/null
          mkdir "$RUNNER_TEMP/download"
          gh release download "$TAG" --pattern "$ZIP_NAME" --dir "$RUNNER_TEMP/download"
          cmp "$ZIP" "$RUNNER_TEMP/download/$ZIP_NAME"
          printf '{"draft":false,"make_latest":"false"}' > "$RUNNER_TEMP/publish.json"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/published.json"
          test "$(jq -r .draft "$RUNNER_TEMP/published.json")" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" = "$release_id"
          latest_after="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name)"
          test "$latest_after" = "$latest_before"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" = "$TARGET"
          echo "KAR206_STABLE_RELEASE_VERIFIED tag=$TAG tag_object=$tag_object target=$TARGET release_id=$release_id bytes=$BYTES sha256=$SHA latest_unchanged=$latest_before"
