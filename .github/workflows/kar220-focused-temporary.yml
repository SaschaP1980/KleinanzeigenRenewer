name: KAR-220 focused field transfer (temporary)
on:
  push:
    branches: [work/KAR-220]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Execute actual-source focused and preserved form behavior
        run: |
          git rev-parse HEAD
          git diff --name-only 514c3dcdaae09b7e583326089316ada59c229e9f -- src manifest.json
          git diff --exit-code 4b7159ddb1f0cc9d2be1144c2c34faa970170b82 -- tests/kar220-field-transfer.cjs
          node --test tests/kar220-field-transfer.cjs
          node tests/kar132-modern-category-modal.cjs
          node tests/kar132-wearables-attributes.cjs
          node tests/kar210-kar201-baseline-safety.cjs
          node tests/kar217-updater-removal.cjs
