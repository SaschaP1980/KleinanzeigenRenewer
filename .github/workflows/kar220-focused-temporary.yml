name: KAR-220 successor diagnostics (temporary)
on:
  push:
    branches: [work/KAR-220]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Inventory exact prior-version references
        run: git grep -n -F '2.0.3.0' -- tests scripts .github ':!tests/fixtures/*' || true
      - name: Verify successor and retained tests
        run: |
          git rev-parse HEAD
          python3 tests/kar210-baseline-restore.py
          node tests/kar220-successor-contract.cjs
          node tests/kar217-successor-contract.cjs
          node tests/kar210-baseline-version-contract.cjs
          python3 tests/kar210-version-identity.py
          node tests/kar220-field-transfer.cjs
