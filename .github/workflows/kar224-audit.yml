name: KAR-224 S07 successor audit (temporary)
on:
  push:
    branches: [work/KAR-224]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory remaining exact-version references
        run: |
          git grep -n -F '2.0.5.1' -- scripts tests .github/workflows | cut -c1-400 || true
      - name: Audit prospective clean source and build
        run: |
          set -euo pipefail
          test "$(python3 scripts/product_version.py)" = 2.0.6.0
          npm ci
          rm .github/workflows/kar224-audit.yml
          python3 tests/kar210-baseline-restore.py
          node tests/kar224-successor-contract.cjs
          node tests/kar210-baseline-version-contract.cjs
          node --test tests/kar224-s07.cjs
          node --test tests/kar210-trash-template-recovery-coalescing.cjs
          node tests/kar222-focused-gate.cjs
          python3 scripts/package.py "$RUNNER_TEMP/kar-s07-a"
          python3 scripts/package.py "$RUNNER_TEMP/kar-s07-b"
          ZIP=kleinanzeigen-renewal-chrome-v2.0.6.0.zip
          cmp "$RUNNER_TEMP/kar-s07-a/$ZIP" "$RUNNER_TEMP/kar-s07-b/$ZIP"
          test ! -e "release/$ZIP"
          cp "$RUNNER_TEMP/kar-s07-a/$ZIP" "release/$ZIP"
          sha256sum "release/$ZIP"
          time bash scripts/coverage-gate.sh
          time bash scripts/build.sh "$RUNNER_TEMP/kar-s07-official"
          cmp "release/$ZIP" "$RUNNER_TEMP/kar-s07-official/$ZIP"
      - name: Preserve prospective candidate bytes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kar224-s07-prospective
          path: release/kleinanzeigen-renewal-chrome-v2.0.6.0.zip
          if-no-files-found: error
  transfer:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kar224-s07-prospective
          path: candidate
      - name: Attest and expose exact tested ZIP bytes for a leased Work commit
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          p=Path('candidate/kleinanzeigen-renewal-chrome-v2.0.6.0.zip')
          data=p.read_bytes()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              assert json.loads(z.read('manifest.json'))['version']=='2.0.6.0'
              assert len(z.namelist())==122
          encoded=base64.b64encode(data).decode('ascii')
          chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
          print('KAR224_ZIP_ATTEST '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'chunks':len(chunks)}))
          for i,chunk in enumerate(chunks):
              print('KAR224_ZIP_CHUNK_%04d %s' % (i,chunk))
          PY

  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Identify every independent test failure (diagnostic, not coverage proof)
        run: |
          rm .github/workflows/kar224-audit.yml
          python3 scripts/package.py "$RUNNER_TEMP/diag-build"
          cp "$RUNNER_TEMP/diag-build/kleinanzeigen-renewal-chrome-v2.0.6.0.zip" release/
          python3 - <<'PY'
          import json,os,subprocess
          commands=json.load(open('package.json'))['scripts']['test'].split(' && ')
          prefix,commands[0]=commands[0].split('; ',1)
          failures=[]
          for i,cmd in enumerate(commands,1):
              p=subprocess.run(prefix+'; '+cmd,shell=True,executable='/bin/bash',text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
              if p.returncode:
                  failures.append(cmd)
                  print('DIAG_FAIL',i,cmd,flush=True)
                  print(p.stdout[-9000:],flush=True)
          print('DIAG_TOTAL',len(commands),'FAIL',len(failures),json.dumps(failures),flush=True)
          PY
