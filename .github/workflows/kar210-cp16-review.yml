name: KAR-210 CP16 P13 owner contracts
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp16-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/kar210-p13-persisted-owner-baseline.cjs
      - run: node tests/kar210-test-disposition-contract.cjs
  owner-read-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar210-p13-lock-read-uncertainty.cjs

# Remove only five already KAR-99-branch-specific excluded P13 steps.
