name: KAR-171 R1 publication evidence (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/kar99-publish-outcome.cjs
      - tests/kar175-publish-intent-authorization.cjs
      - src/background/services/publish-intent-authorization-service.js
      - src/background/services/auto-publish-intent-journal.js
      - .github/workflows/kar171-r1-publish.yml
permissions:
  contents: read
jobs:
  r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for full R1 safety gate
        run: npm ci
      - name: All focused R1 publication, replacement and origin lineage regressions
        run: |
          node tests/kar99-publish-outcome.cjs
          node tests/kar175-publish-intent-authorization.cjs
          node tests/kar99-phase4-outcome-reconciliation.cjs
          node --test tests/kar99-p13f2e2d2a-remote-admission-lineage.cjs
      - name: Complete clean-tree runtime, coverage and architecture gates
        shell: bash
        run: |
          rm .github/workflows/kar171-r1-publish.yml
          bash scripts/coverage-gate.sh
