name: KAR-171 R1 publication evidence (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/kar99-publish-outcome.cjs
      - src/background/services/auto-publish-intent-journal.js
      - .github/workflows/kar171-r1-publish.yml
permissions:
  contents: read
jobs:
  r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R1 publication outcome journal and original P8 origin
        run: node tests/kar99-publish-outcome.cjs
