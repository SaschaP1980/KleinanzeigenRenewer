name: KAR-171 main integration dry-run validation (temporary)
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  resolve_and_validate:
    name: Exact SHA merge conflict resolution and full regression without push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge main in runner and resolve precisely seven reviewed conflicts
        shell: bash
        env:
          EXPECTED_MAIN: a267caabd53427aa7378be5017787ab32e7c88bd
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          echo "TESTED_WORK=$(git rev-parse HEAD)"
          echo "TESTED_MAIN=$EXPECTED_MAIN"
          set +e
          git -c user.email=kar-ci@example.invalid -c user.name=KAR-CI merge --no-commit --no-ff "$EXPECTED_MAIN"
          status=$?
          set -e
          test "$status" -eq 1
          python3 docs/maintenance/KAR171_MAIN_SYNC_RESOLVER.py
          # Disposable workflows are NOT part of a product source tree. Remove
          # them in the runner before executing the immutable closure gate.
          git rm -f .github/workflows/kar171-upstream-drymerge.yml .github/workflows/kar171-upstream-integrated-validation.yml
          python3 docs/maintenance/KAR171_PREVIEW_VERSION.py
          git add manifest.json package.json package-lock.json release/release-spec.json CHANGELOG.md tests/current-patch-policy-regression.cjs
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          for file in src/background/background.js src/background/services/auto-publish-intent-journal.js src/background/services/phase4-uncertainty-journal.js src/background/services/remote-delete-replacement-service.js src/content/inventory-delete-operations.js src/content/inventory-runner.js; do
            node --check "$file"
          done
          node -e "const p=require('./package.json'),m=require('./manifest.json');if(p.version!==m.version||m.version!=='1.25.13')process.exit(1);console.log('MERGED_VERSION',m.version)"
          echo "MERGE_DRY_RUN_RESOLVED_NO_PUSH"
      - name: Install dependencies
        run: npm ci
      - name: Archive exact v1.25.13 preview ZIP before mandatory parity self-test
        shell: bash
        env:
          EXPECTED_MAIN: a267caabd53427aa7378be5017787ab32e7c88bd
        run: |
          set -euo pipefail
          python3 scripts/package.py "$RUNNER_TEMP/kar171-preview"
          ZIP="release/kleinanzeigen-renewal-chrome-v1.25.13.zip"
          test ! -e "$ZIP"
          cp "$RUNNER_TEMP/kar171-preview/kleinanzeigen-renewal-chrome-v1.25.13.zip" "$ZIP"
          git add -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          python3 scripts/verify_committed_chrome_zip.py --base-sha "$EXPECTED_MAIN"
      - name: Full regression, architecture, public function and coverage gates
        run: bash scripts/coverage-gate.sh
      - name: Build and integrity-check Chrome ZIP from merged tree (runner-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-merge-build"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-merge-build"
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP="$RUNNER_TEMP/kar171-merge-build/kleinanzeigen-renewal-chrome-v$VERSION.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "MERGED_PACKAGE_VALID_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "MERGED_PACKAGE_VALID_BYTES=$(stat -c %s "$ZIP")"
