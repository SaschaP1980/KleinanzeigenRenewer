name: KAR-222 baseline behavioral characterization
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-characterization-temp.yml']
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact untouched S05 runtime
        run: |
          set -eux
          git diff --exit-code 5d650e288ef2cea615f17717ebb1531b1cc4b4ae HEAD -- src manifest.json lib icons tests
          echo "KAR222_RUNTIME_AND_TESTS_IDENTICAL_TO_S05"
          node --version
      - name: Execute retained product witnesses without changing dispositions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          failures=0
          for name in kar210-kar199-baseline-phase4 kar210-cp36-phase4-product-witness kar199-phase4-no-transport-replay kar199-phase4-bounded-runtime kar199-phase4-unverified-state-runtime kar210-cp36-phase4-unknown-witness kar210-cp38-publish-uncertainty-witness kar210-p13-lock-read-uncertainty kar210-kar150-uncertain-start-witness kar99-p9-tab-gone-monotonic kar210-p9-independent-tab-lifecycle v1231-renewal-workflow-runtime v1233-mass-renewal-workflow-runtime v12230-global-emergency-reset v1235-terminal-template-emergency-reset; do
            echo "KAR222_BEGIN $name"
            timeout 30s node --test --test-reporter=tap "tests/$name.cjs"
            rc=$?
            echo "KAR222_END $name rc=$rc"
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "KAR222_NONZERO_COMMANDS=$failures"
          test "$failures" -eq 0
