name: KAR Work PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: kar-work-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contract:
    name: Issue / Rolling Comment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enforce issue, branch, exact PR HEAD and normative Rolling Comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^work/KAR-([0-9]+)$ ]] || {
            echo "Feature/Minor/Major PRs must use work/KAR-<issue>." >&2
            exit 1
          }
          ISSUE="${BASH_REMATCH[1]}"
          # Bound the GH event/comment-readback race without weakening the contract.
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > /tmp/kar-issue.json
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" > /tmp/kar-comments.json
            if node scripts/kar-work-pr-contract.cjs /tmp/kar-issue.json /tmp/kar-comments.json; then
              echo "KAR Work exact-head contract PASS on read $attempt/6"
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "KAR Work canonical contract still RED after 6 reads; FAIL CLOSED" >&2
              exit 1
            fi
            sleep 8
          done

  validation:
    name: Runtime / safety / coverage
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact Work HEAD for mandatory validation
        env:
          EXPECTED_WORK_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORK_HEAD"
          echo "Validated exact Work HEAD: $EXPECTED_WORK_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: KAR-68 strict read-only Native Messaging gateway unit tests
        run: node tests/kar68-native-status-gateway.cjs

      - name: Prove unfixed baseline RED for consistent future PATCH (isolated)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/kar46-unfixed-next-patch-red.py
      - name: Execute actual unfixed KAR-50 prospective-PATCH runner RED (isolated)
        shell: bash
        run: node tests/kar50-unfixed-next-patch-red.cjs
      - name: Execute pinned unfixed archive-E2E boundary RED (isolated)
        shell: bash
        run: python3 tests/kar48-historical-unfixed-red.py
      - name: Execute reusable SHA-bound next-PATCH read-only plan (KAR-52)
        if: github.head_ref == 'work/KAR-52'
        shell: bash
        env:
          PINNED_WORK_HEAD: ${{ github.event.pull_request.head.sha }}
          PINNED_MAIN_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/kar-atomic-patch.py --mode plan --issue 52 --branch work/KAR-52 --work-sha "$PINNED_WORK_HEAD" --main-sha "$PINNED_MAIN_BASE"
      - name: Mandatory coverage and architecture gate
        run: bash scripts/coverage-gate.sh
      - name: Build installable package once
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py "$RUNNER_TEMP/kar-build"
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP="$RUNNER_TEMP/kar-build/kleinanzeigen-renewal-chrome-v$VERSION.zip"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "Chrome ZIP: $(sha256sum "$ZIP")"

  browser_e2e:
    name: Packaged Chromium E2E (exact Work HEAD)
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_WORK_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checked-out PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORK_HEAD"
          echo "E2E exact Work HEAD: $EXPECTED_WORK_HEAD"
          mkdir -p "$RUNNER_TEMP/kar-work-pr-e2e-evidence"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/kar-work-pr-e2e-evidence" >> "$GITHUB_ENV"
      - name: Rebuild, verify committed ZIP, and reject version-path collisions
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version_name || require('./manifest.json').version")"
          python3 scripts/verify_committed_chrome_zip.py --base-sha "$EXPECTED_BASE_SHA" --report "$EVIDENCE_DIR/committed-zip-parity.json"
          E2E_CHROME_ZIP="$PWD/release/kleinanzeigen-renewal-chrome-v$VERSION.zip"
          ZIP="$E2E_CHROME_ZIP"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "E2E_CHROME_ZIP=$E2E_CHROME_ZIP" >> "$GITHUB_ENV"
          sha256sum "$ZIP" | tee "$EVIDENCE_DIR/zip-sha256.txt"
      - name: Real packaged Chromium E2E (logged-out local fixtures)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$KR_CHROME_BINARY"
          export KR_E2E_BROWSER_CHANNEL=chromium
          E2E_ROOT="$RUNNER_TEMP/kar-work-pr-e2e-extension"
          mkdir -p "$E2E_ROOT"
          unzip -q "$E2E_CHROME_ZIP" -d "$E2E_ROOT"
          export KR_E2E_EXTENSION_ROOT="$E2E_ROOT"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$EVIDENCE_DIR/browser-e2e-report.json"
          python3 tests/e2e/verify_pr_e2e_report.py --report "$EVIDENCE_DIR/browser-e2e-report.json" --zip "$E2E_CHROME_ZIP" --expected-head "$EXPECTED_WORK_HEAD" --out "$EVIDENCE_DIR/e2e-attestation.json"
      - name: Preserve real browser E2E evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kar-work-pr-browser-e2e-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kar-work-pr-e2e-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows_updater:
    name: KAR-59 Phase 1 Windows updater fixture/rollback
    needs: validation
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KAR_UPDATER_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Real Windows PowerShell 5.1 updater fixture tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-updater-phase1.ps1
      - name: Hosted Windows Native Messaging host and IPC security tests (KAR-64)
        shell: powershell
        env:
          KAR_NATIVE_HOST_TEST_MODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-native-host-wave1.ps1
      - name: KAR-73 disposable Windows Shell URI handoff PoC (no Chrome, no update)
         shell: powershell
         env:
           KAR73_URI_POC_TEST_MODE: '1'
         run: |
           $ErrorActionPreference = 'Stop'
           & .\tests\kar73-windows-uri-protocol.ps1
