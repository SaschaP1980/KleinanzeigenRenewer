name: KAR-222 S06 source contract audit
on:
  push:
    branches: [work/KAR-222]
    paths: ['tests/kar222-focused-gate.cjs','.github/workflows/kar222-s06-temp.yml','tests/current-patch-policy.cjs','docs/maintenance/KAR222_SUCCESSOR_SCOPE.json','manifest.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Explicit version references
        run: git grep -n -E '2\.0\.4\.0|2\.0\.5\.0|isS05Version|S05_GATES_PENDING' -- tests scripts .github/workflows | cut -c1-300
      - name: Exact runtime and version gates
        run: |
          set +e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          failed=0
          for command in 'python3 scripts/product_version.py' 'python3 tests/kar210-baseline-restore.py' 'node tests/kar222-successor-contract.cjs' 'node tests/kar210-baseline-version-contract.cjs' 'node tests/kar213-successor-contract.cjs' 'node tests/kar217-successor-contract.cjs' 'node tests/kar220-successor-contract.cjs' 'node tests/kar210-test-disposition-contract.cjs' 'node tests/v12317c1-template-module-public-api.cjs'; do
            bash -c "$command"
            rc=$?
            echo "KAR222_GATE $command rc=$rc"
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
          done
          test "$failed" -eq 0
      - name: S06 reactivated and exact partial witnesses
        if: always()
        run: |
          set +e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          failed=0
          for f in tests/kar222-successor-contract.cjs tests/kar199-emergency-reset-candidate-recovery.cjs tests/kar199-phase4-no-transport-replay.cjs tests/kar199-phase4-ui-runtime.cjs tests/kar210-cp36-phase4-unknown-witness.cjs tests/kar210-kar150-uncertain-start-witness.cjs tests/kar210-p9-independent-tab-lifecycle.cjs tests/kar222-b14-recovery.cjs tests/kar222-b16-recovery-ui.cjs tests/kar222-delete-no-replay.cjs tests/kar222-mass-recovery-witness.cjs tests/kar222-roster-scan-cost.cjs tests/kar222-tab-registry-cost.cjs tests/kar222-focused-gate.cjs tests/kar210-cp35-owner-product-witness.cjs tests/kar210-cp37-outcome-product-witness.cjs; do
            node "$f"
            rc=$?
            echo "KAR222_RETAINED $f rc=$rc"
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
          done
          test "$failed" -eq 0
      - name: Full sequential coverage gate (diagnostic workflow absent from tested tree)
        if: always()
        run: |
          rm -- .github/workflows/kar222-s06-temp.yml
          git diff --name-status
          bash scripts/coverage-gate.sh
