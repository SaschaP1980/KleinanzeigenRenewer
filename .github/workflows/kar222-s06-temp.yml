name: KAR-222 S06 source contract audit
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-s06-temp.yml','tests/current-patch-policy.cjs','docs/maintenance/KAR222_SUCCESSOR_SCOPE.json','manifest.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Explicit version references
        run: git grep -n -E '2\.0\.4\.0|2\.0\.5\.0|isS05Version|S05_GATES_PENDING' -- tests scripts .github/workflows | cut -c1-300
      - name: Exact runtime and version gates
        run: |
          set +e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          failed=0
          for command in 'python3 scripts/product_version.py' 'python3 tests/kar210-baseline-restore.py' 'node tests/kar222-successor-contract.cjs' 'node tests/kar210-baseline-version-contract.cjs' 'node tests/kar213-successor-contract.cjs' 'node tests/kar217-successor-contract.cjs' 'node tests/kar220-successor-contract.cjs' 'node tests/kar210-test-disposition-contract.cjs' 'node tests/v12317c1-template-module-public-api.cjs'; do
            bash -c "$command"
            rc=$?
            echo "KAR222_GATE $command rc=$rc"
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
          done
          test "$failed" -eq 0
      - name: Retained npm commands audit
        if: always()
        run: |
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json,subprocess,os,time
          commands=json.load(open('package.json'))['scripts']['test'].split(' && ')
          env=os.environ.copy()
          env['NODE_OPTIONS']='--require ./tests/v12222-vm-legacy-bridge.cjs'
          env['NODE_V8_COVERAGE']=os.path.abspath('coverage/raw')
          failed=[]
          for i,command in enumerate(commands):
              start=time.monotonic()
              try:
                  r=subprocess.run(command,shell=True,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=60)
                  code=r.returncode
                  if code: print(r.stdout[-5000:],flush=True)
              except subprocess.TimeoutExpired:
                  code=124
              print(f'KAR222_NPM {i+1} {code} {time.monotonic()-start:.3f}s {command}',flush=True)
              if code: failed.append((i+1,command,code))
          print('KAR222_NPM_SUMMARY '+json.dumps({'total':len(commands),'failed':failed}),flush=True)
          raise SystemExit(bool(failed))
          PY
