name: KAR-171 W3D3B3 live account terminal recheck (temporary)

on:
  push:
    branches: [work/KAR-171]

permissions:
  contents: read

jobs:
  focused:
    name: W3D3B3 final PAGE_STATUS tab/profile RED GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay independent My Ads authentication and tab switch
        run: node tests/kar99-additional-owner-producers.cjs
      - name: Install complete test dependencies
        run: npm ci
      - name: Full clean-tree unit/coverage/architecture/no-regression gate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kar171-w3d3b3-focused.yml
          bash scripts/coverage-gate.sh
