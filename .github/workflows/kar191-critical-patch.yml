name: KAR-191 temporary critical diagnostic verification and ZIP build

on:
  push:
    branches: [work/KAR-191]

permissions:
  contents: read

jobs:
  diagnostic_tests:
    name: Independent diagnostic and full safety gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real KAR-191 focused diagnostic route, UI and ZIP integrity tests
        run: |
          node tests/kar191-diagnostic-recovery.cjs
          node tests/kar191-diagnostic-zip-integrity.cjs
      - name: Full runtime, safety, dynamic coverage and architecture
        run: bash scripts/coverage-gate.sh

  one_shot_package:
    name: Owner-authorized exact-HEAD v1.24.4 Chrome ZIP only
    needs: diagnostic_tests
    if: "${{ startsWith(github.event.head_commit.message, 'ci(KAR-191): build v1.24.4 base=') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: read
    env:
      MAIN_SHA: 2a07edda7520f2b57e422236c957853d68697f0a
      INTEGRATED_188: 83284244863d04068c79c1f2d8aa78d03225ff50
      ZIP: release/kleinanzeigen-renewal-chrome-v1.24.4.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exact immutable marker, main and merged v1.24.3 archive provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/KAR-191'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          SOURCE_SHA="$(git log -1 --pretty=%s | sed -n 's/^ci(KAR-191): build v1.24.4 base=\([a-f0-9]\{40\}\)$/\1/p')"
          test -n "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ''
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/work/KAR-191 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INTEGRATED_188" "$GITHUB_SHA"
          test "$(git rev-parse HEAD:release/kleinanzeigen-renewal-chrome-v1.24.3.zip)" = "$(git rev-parse "$INTEGRATED_188:release/kleinanzeigen-renewal-chrome-v1.24.3.zip")"
          test ! -e "$ZIP"
          node scripts/kar-work-pr-preflight.cjs --issue 191 --head-sha "$GITHUB_SHA"
      - name: Metadata-only 1.24.3 to 1.24.4, deterministic Chrome ZIP, no publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=('manifest.json','package.json','package-lock.json','release/release-spec.json')
          objects={name:json.loads(Path(name).read_text()) for name in paths}
          assert all(objects[name].get('version')=='1.24.3' for name in paths)
          assert objects['package.json']['displayVersion']=='1.24.3'
          assert objects['package-lock.json']['packages']['']['version']=='1.24.3'
          assert objects['release/release-spec.json']['packageVersion']=='1.24.3'
          for name,data in objects.items():
            data['version']='1.24.4'
            if name=='package.json': data['displayVersion']='1.24.4'
            if name=='package-lock.json': data['packages']['']['version']='1.24.4'
            if name=='release/release-spec.json': data['packageVersion']='1.24.4'
            Path(name).write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir -p "$RUNNER_TEMP/kar191-primary" "$RUNNER_TEMP/kar191-independent"
          python3 scripts/package.py "$RUNNER_TEMP/kar191-primary"
          python3 scripts/package.py "$RUNNER_TEMP/kar191-independent"
          cmp "$RUNNER_TEMP/kar191-primary/kleinanzeigen-renewal-chrome-v1.24.4.zip" "$RUNNER_TEMP/kar191-independent/kleinanzeigen-renewal-chrome-v1.24.4.zip"
          cp "$RUNNER_TEMP/kar191-primary/kleinanzeigen-renewal-chrome-v1.24.4.zip" "$ZIP"
          unzip -t "$ZIP"
          sha256sum "$ZIP"
          bash scripts/coverage-gate.sh
      - name: Real isolated Chromium against the exact new v1.24.4 Chrome ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tests/e2e/requirements.txt
          python3 -m playwright install --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export KR_E2E_BROWSER_CHANNEL=chromium
          mkdir -p "$RUNNER_TEMP/kar191-e2e"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kar191-e2e"
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar191-e2e"
          python3 tests/e2e/kar161-startup-smoke.py
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar191-browser-e2e.json"
      - name: Commit only patch metadata, verified ZIP and removal of this temporary runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/work/KAR-191 | cut -f1)" = "$GITHUB_SHA"
          git add manifest.json package.json package-lock.json release/release-spec.json
          git add -f "$ZIP"
          git rm .github/workflows/kar191-critical-patch.yml
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths.txt"
          printf '%s\n' manifest.json package.json package-lock.json release/release-spec.json "$ZIP" .github/workflows/kar191-critical-patch.yml | sort > "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(KAR-191): v1.24.4 critical diagnostic ZIP and retire one-shot test runner'
          NEW_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/work/KAR-191"
          test "$(git ls-remote origin refs/heads/work/KAR-191 | cut -f1)" = "$NEW_SHA"
          node scripts/kar-work-pr-preflight.cjs --issue 191 --head-sha "$NEW_SHA" --prior-sha "$GITHUB_SHA" --sync-head
          echo "KAR191_VERIFIED_CHROME_ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)"
          echo "KAR191_FINAL_WORK_SHA=$NEW_SHA"
