name: KAR-43 One-Time Version Allowlist Harmonization
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kar-43-version-allowlist-once.yml'

permissions:
  contents: write

jobs:
  version-allowlist-only:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/KAR-43'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/KAR-43
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact authorized work HEAD and version
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(node -p "require('./manifest.json').version")" = "1.23.24"
          test "$(node -p "require('./package.json').version")" = "1.23.24"
          test "$(git branch --show-current)" = "work/KAR-43"
      - name: Add only new PATCH version to existing literal-version include guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          pattern=re.compile(r"""(?P<q>['"])1\.23\.23(?P=q)(?P<end>\s*\]\s*\.includes\s*\()""")
          changed=[]
          for p in sorted(pathlib.Path("tests").rglob("*")):
            if not p.is_file() or p.suffix not in (".cjs",".mjs",".js"):
              continue
            old=p.read_text(encoding="utf-8")
            new,num=pattern.subn(lambda m:m.group("q")+"1.23.23"+m.group("q")+","+m.group("q")+"1.23.24"+m.group("q")+m.group("end"),old)
            if num:
              p.write_text(new,encoding="utf-8")
              changed.append((str(p),num))
          if not changed:
            raise SystemExit("No remaining guards found; refuse unrelated write")
          print("KAR43_GUARD_UPDATES_BEGIN")
          for p,n in changed:
            print(f"{p}: {n} strict literal version(s) added")
          print("KAR43_GUARD_UPDATES_END")
          print("KAR43_GUARD_TOTAL",len(changed),sum(n for _,n in changed))
          PY
          node tests/validate.mjs
          node tests/v016-contract.cjs
      - name: Verify only test version literals and delete this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests
          git rm -- .github/workflows/kar-43-version-allowlist-once.yml
          git diff --cached --name-only
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          allowed=".github/workflows/kar-43-version-allowlist-once.yml"
          if not paths or any(p!=allowed and not (p.startswith("tests/") and p.endswith((".cjs",".mjs",".js"))) for p in paths):
            raise SystemExit("Unexpected non-test mutation: "+repr(paths))
          PY
          git commit -m 'test(KAR-43): allow v1.23.24 in historical strict version lists'
          git push origin HEAD:refs/heads/work/KAR-43
          echo 'KAR43_AUTOFIX_PUSH_SUCCESS'
