name: KAR-171 R1 fail-closed outer-catch classification
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
concurrency:
  group: kar171-r1-outer-catch-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: R1 focused native P8, outer catch and privacy
        run: |
          node tests/kar171-r1-native-account-proof.cjs
          node tests/kar171-r1-live-owner-script.cjs
      - name: Full source security, coverage and architecture
        run: |
          rm .github/workflows/kar171-r1-outer-catch-gate.yml
          bash scripts/coverage-gate.sh
