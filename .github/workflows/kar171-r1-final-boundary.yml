name: KAR-171 R1 final scan boundary (temporary)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: read
jobs:
  r1_final_boundary:
    name: Authenticated scan result final boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused R1 late account and online-count drift
        run: node tests/kar171-r1-page-account-continuity.cjs
      - name: Remove disposable CI workflow from intended full-coverage tree
        run: rm .github/workflows/kar171-r1-final-boundary.yml
      - name: Full regression, coverage, public API, architecture and safety gates
        run: bash scripts/coverage-gate.sh
