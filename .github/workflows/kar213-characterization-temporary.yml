name: KAR-213 offline preflight (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-characterization-temporary.yml']
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 371aac9b0b8805197d2eb69dc2aec2a37b3b1650
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "371aac9b0b8805197d2eb69dc2aec2a37b3b1650"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar213-offline-upgrade-preflight.cjs
  cold-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        source: ['1.23.48', '1.25.36']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 371aac9b0b8805197d2eb69dc2aec2a37b3b1650
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "371aac9b0b8805197d2eb69dc2aec2a37b3b1650"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
      - run: python3 -m playwright install --no-shell chromium
      - name: Isolated Chromium cold recovery
        run: |
          set -euo pipefail
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$KR_CHROME_BINARY"
          timeout --kill-after=15s 180s python3 tests/e2e/kar213-cold-upgrade-recovery.py --source "${{ matrix.source }}"
