name: KAR-213 offline preflight (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-characterization-temporary.yml']
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 82179f6a638fcb5bb49043dcd7ca775c523e0291
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "82179f6a638fcb5bb49043dcd7ca775c523e0291"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar213-offline-upgrade-preflight.cjs
  cold-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        source: ['1.23.48', '1.25.36']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 82179f6a638fcb5bb49043dcd7ca775c523e0291
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "82179f6a638fcb5bb49043dcd7ca775c523e0291"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
      - run: python3 -m playwright install --no-shell chromium
      - name: Isolated Chromium cold recovery
        run: |
          set -euo pipefail
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$KR_CHROME_BINARY"
          timeout --kill-after=15s 180s python3 tests/e2e/kar213-cold-upgrade-recovery.py --source "${{ matrix.source }}"
  view-mode-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3b6d07049f2f7e0e9b50dcbcb3b1ee34bfc46c0f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require new view-mode negative to fail on unfixed checker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3b6d07049f2f7e0e9b50dcbcb3b1ee34bfc46c0f"
          set +e
          node --test tests/kar213-offline-upgrade-preflight.cjs > "$RUNNER_TEMP/view-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/view-red.log"
          test "$rc" = 1
          grep -q 'not ok 9 - unrecognized persisted view mode' "$RUNNER_TEMP/view-red.log"
          grep -q '# pass 8' "$RUNNER_TEMP/view-red.log"
          grep -q '# fail 1' "$RUNNER_TEMP/view-red.log"
