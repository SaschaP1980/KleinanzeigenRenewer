name: KAR-213 offline preflight (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-characterization-temporary.yml']
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0319e3943097763befbf82c849c90d3b4859a392
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "0319e3943097763befbf82c849c90d3b4859a392"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar213-offline-upgrade-preflight.cjs
