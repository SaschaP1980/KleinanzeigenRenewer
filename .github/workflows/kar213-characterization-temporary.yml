name: KAR-213 focused compatibility (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-characterization-temporary.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c339afd7271a6d1588540ad482b469aa4d180c25
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "c339afd7271a6d1588540ad482b469aa4d180c25"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/kar213-cross-generation-characterization.cjs
