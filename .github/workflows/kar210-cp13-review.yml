name: KAR-210 CP13 startup retention inventory review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp13-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/kar210-bootstrap-schema-boundaries.cjs tests/kar210-inventory-save-refresh-baseline.cjs
      - run: node tests/kar210-test-disposition-contract.cjs
      - run: NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node tests/jpeg.cjs
  startup-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar210-startup-isolation-witness.cjs

# JPEG assertions preserved; bind to historical background owner.
