name: KAR-217 focused removal and inventory (temporary)
on:
  push:
    branches: [work/KAR-217]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --test tests/kar217-updater-removal.cjs
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Runtime and active contract inventory
        run: |
          git rev-parse HEAD
          git grep -nEi 'GET_NATIVE_UPDATE_STATUS|sendNativeMessage|connectNative|nativeMessaging|native[-_]?update|native[-_]?status[-_]?bridge|windows-updater-channel|de\.kleinanzeigenrenewer\.updater|oneclick' -- src manifest.json scripts/package.py .github/workflows README.md || true
          git grep -lEi 'GET_NATIVE_UPDATE_STATUS|sendNativeMessage|connectNative|nativeMessaging|native[-_]?update|native[-_]?status[-_]?bridge|windows-updater-channel|de\.kleinanzeigenrenewer\.updater|oneclick' -- tests scripts .github/workflows | sort
          git grep -lE '2\.0\.2\.0|2\.0\.3\.0|isS03Version|isS09Version' -- tests scripts .github/workflows | sort
          git grep -nE '\(([^)]*/)?(native-update-check-ui|native-update-status-gateway|native-status-bridge)\.js([#)]|$)' -- '*.md' || true
  dispositions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/kar217-updater-test-disposition.cjs
  successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/kar217-successor-contract.cjs
  full-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Create local source-matching candidate for repository closure (diagnostic only)
        run: |
          set -euo pipefail
          V="$(python3 scripts/product_version.py)"
          test "$V" = 2.0.3.0
          test ! -e "release/kleinanzeigen-renewal-chrome-v$V.zip"
          python3 scripts/package.py "$RUNNER_TEMP/diagnostic-build"
          cp "$RUNNER_TEMP/diagnostic-build/kleinanzeigen-renewal-chrome-v$V.zip" release/
      - run: bash scripts/coverage-gate.sh
  independent-contract-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Independent active contract diagnostics (not an acceptance gate)
        run: |
          python3 tests/kar210-baseline-restore.py
          python3 tests/kar210-version-identity.py
          node tests/kar210-test-disposition-contract.cjs
          node tests/kar210-baseline-version-contract.cjs
          node tests/validate.mjs
      - name: Active suite failure inventory
        if: always()
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          mkdir -p coverage/raw
          export NODE_V8_COVERAGE="$PWD/coverage/raw"
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json, subprocess
          commands=json.load(open('package.json'))['scripts']['test'].split('; ',1)[1].split(' && ')
          failed=[]
          for command in commands:
              if not command.startswith('node '):
                  raise RuntimeError(command)
              try:
                  result=subprocess.run(command.split(),capture_output=True,text=True,timeout=60)
                  print(f'RC={result.returncode} {command}',flush=True)
                  if result.returncode:
                      failed.append(command)
                      print((result.stdout+result.stderr)[-2400:],flush=True)
              except subprocess.TimeoutExpired:
                  failed.append(command)
                  print('TIMEOUT '+command,flush=True)
          print('FAILED COMMANDS:',json.dumps(failed),flush=True)
          raise SystemExit(bool(failed))
          PY
  deterministic-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build twice, compare and emit exact candidate bytes (Work only)
        run: |
          set -euo pipefail
          V="$(python3 scripts/product_version.py)"
          test "$V" = 2.0.3.0
          python3 scripts/package.py "$RUNNER_TEMP/build-a"
          python3 scripts/package.py "$RUNNER_TEMP/build-b"
          ZIP="kleinanzeigen-renewal-chrome-v$V.zip"
          cmp "$RUNNER_TEMP/build-a/$ZIP" "$RUNNER_TEMP/build-b/$ZIP"
          unzip -t "$RUNNER_TEMP/build-a/$ZIP" >/dev/null
          python3 - "$RUNNER_TEMP/build-a/$ZIP" <<'PY'
          import base64, hashlib, json, pathlib, sys, zipfile
          p=pathlib.Path(sys.argv[1])
          data=p.read_bytes()
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist()) == len(set(z.namelist())) == 122
              assert not any(n.startswith("docs/history/") or "native-update" in n or "native-status-bridge" in n for n in z.namelist())
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["version"] == "2.0.3.0"
              assert sorted(manifest["permissions"]) == ["activeTab","scripting","storage","unlimitedStorage"]
              assert "icons/action-update.svg" in z.namelist()
          print("KAR217_CANDIDATE_META "+json.dumps({"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"gitBlob":hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest(),"entries":122}),flush=True)
          encoded=base64.b64encode(data).decode()
          chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
          for i,chunk in enumerate(chunks):
              print(f"KAR217_CHUNK {i:04d} {len(chunks):04d} {chunk}",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kar217-diagnostic-candidate
          path: ${{ runner.temp }}/build-a/kleinanzeigen-renewal-chrome-v2.0.3.0.zip
          if-no-files-found: error
  repository-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          V="$(python3 scripts/product_version.py)"
          python3 scripts/package.py "$RUNNER_TEMP/diagnostic-build"
          cp "$RUNNER_TEMP/diagnostic-build/kleinanzeigen-renewal-chrome-v$V.zip" release/
          failed=0
          for p in kar167-file-layout kar167-script-closure kar167-icons-closure kar167-test-coverage-closure kar167-final-repository-closure kar174-ui-asset-relocation kar170-documentation-contract; do
            echo "TAIL $p"
            if node "tests/$p.cjs"; then echo "TAIL PASS $p"; else failed=1; echo "TAIL FAIL $p"; fi
          done
          exit "$failed"
