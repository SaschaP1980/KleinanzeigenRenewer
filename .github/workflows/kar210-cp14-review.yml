name: KAR-210 CP14 public evidence retry navigation correlation
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp14-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/kar210-kar175-public-navigation-baseline.cjs tests/kar210-kar175-phase1-retry-baseline.cjs tests/kar210-kar175-correlation-url-baseline.cjs
      - run: node tests/kar210-test-disposition-contract.cjs

# Historical public evidence provider registers through KRDeps.
