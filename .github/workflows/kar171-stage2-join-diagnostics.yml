name: KAR-171 Stage2 historical publication join reasons (temporary)
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  historical_join_reasons:
    name: Fail-closed original P8 Stage2 publish-join diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Focused native-storage historical-join negative matrix
        run: node tests/kar171-r1-phase4-lineage-preflight.cjs
      - name: Remove disposable Work workflow before full code gates
        run: rm .github/workflows/kar171-stage2-join-diagnostics.yml
      - name: Full safety, public API, architecture and coverage regression
        run: bash scripts/coverage-gate.sh
