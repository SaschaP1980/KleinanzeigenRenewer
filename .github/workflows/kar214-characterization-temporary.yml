name: KAR-214 successor characterization (temporary)
on:
  push:
    branches: ['work/KAR-214']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: All S09 targeted suites
        shell: bash
        run: |
          rc=0
          for t in tests/kar214-retention-startup.cjs tests/kar161-trash-retention.cjs tests/kar164-trash-sort.cjs tests/kar165-trash-retention-warning.cjs tests/kar186-retention-hydration.cjs; do
            node "$t" || rc=1
          done
          exit "$rc"
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Enumerate and run unchanged active tests independently (no gate credit)
        shell: bash
        run: |
          mkdir -p coverage/raw
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json, pathlib, re, subprocess, os, concurrent.futures
          commands=json.loads(pathlib.Path('package.json').read_text())['scripts']['test'].split(' && ')
          commands=[re.sub(r"^export NODE_OPTIONS='[^']+'; ","",c) for c in commands]
          commands=[c for c in commands if not c.startswith('node scripts/')]
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs')
          def run(c):
              try:
                  p=subprocess.run(c,shell=True,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=90)
                  lines=p.stdout.splitlines()
                  useful=[s[:220] for s in lines if re.search(r'AssertionError|^Error:|^TypeError:|^ReferenceError:|^not ok |^FAIL |^  error:|^  code:',s)]
                  return (c,p.returncode,useful[:8])
              except subprocess.TimeoutExpired:
                  return (c,124,['timeout'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(run,commands))
          for c,rc,e in results:
              if rc: print('KAR214_RED',c,'RC='+str(rc),json.dumps(e,ensure_ascii=False),flush=True)
          print('KAR214_TOTAL',len(results),'PASS',sum(rc==0 for _,rc,_ in results),'RED',sum(rc!=0 for _,rc,_ in results),flush=True)
          PY
