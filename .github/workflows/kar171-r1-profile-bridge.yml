name: KAR-171 R1 temporary profile-linkage regression

on:
  push:
    branches:
      - work/KAR-171

permissions:
  contents: read

concurrency:
  group: kar171-r1-profile-linkage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: R1 native-evidence safety and full regression (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused Stage2 adversarial source tests
        run: node tests/kar171-r1-phase4-lineage-preflight.cjs
      - name: Full runtime, safety, coverage and architecture gate
        run: bash scripts/coverage-gate.sh
