name: KAR-171 R2 native active receipt (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tools/windows/KleinanzeigenRenewer.NativeHost.cs
      - tests/windows-native-host-wave1.ps1
      - tests/kar68-native-status-gateway.cjs
      - tests/kar99-p13-native-transaction-closure.cjs
      - src/background/services/additional-owner-observer.js
      - src/background/background.js
      - src/background/services/native-update-status-gateway.js
      - .github/workflows/kar171-r2-receipt.yml
permissions:
  contents: read
jobs:
  native-private-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: R2 private authenticated read-only NativeHost transport
        run: |
          node tests/kar68-native-status-gateway.cjs
          node --test tests/kar99-p13-native-transaction-closure.cjs
  native-receipt:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KAR_UPDATER_TEST_MODE: '1'
      KAR_NATIVE_HOST_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Execute NativeHost offline receipt proof on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\windows-native-host-wave1.ps1

  full-gate:
    name: Full final-tree runtime, safety and public coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci
      - name: Run all existing gates on eventual clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kar171-r2-receipt.yml
          bash scripts/coverage-gate.sh
