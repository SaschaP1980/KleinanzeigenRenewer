name: KAR-171 R1 genuine isolated MV3 in-flight scanner interruption
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  isolated-inflight:
    if: >-
      github.event.head_commit.message == 'test(KAR-171): add isolated real-MV3 in-flight source scanner gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact source, no manifest/product permission drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "a267caabd53427aa7378be5017787ab32e7c88bd"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['version']=='1.25.21'
          assert set(m['permissions'])=={'activeTab','storage','unlimitedStorage','scripting','nativeMessaging'}
          assert Path('release/kleinanzeigen-renewal-chrome-v1.25.21.zip').is_file()
          assert Path('tests/e2e/kar171_r1_inflight_mv3_probe.py').is_file()
          print('PASS unchanged production extension identity and permissions')
          PY
      - name: Install locked dependencies and run static fixture safety contracts
        shell: bash
        run: |
          npm ci
          node --test tests/kar171-r1-native-inflight-fixture-contract.cjs
          node --test tests/kar171-r1-interruption-replay-integration.cjs
      - name: Required complete safety coverage and architecture
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kar171-r1-native-inflight-temporary.yml
          bash scripts/coverage-gate.sh
      - name: Install pinned Chromium and run REAL MV3 worker mid-query termination
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$KR_CHROME_BINARY"
          export KR_E2E_BROWSER_CHANNEL=chromium
          mkdir -p "$RUNNER_TEMP/kar171-real-mv3"
          python3 tests/e2e/kar171_r1_inflight_mv3_probe.py --report "$RUNNER_TEMP/kar171-real-mv3/inflight-report.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-real-mv3'/'inflight-report.json').read_text())
          assert r['status']=='PASS',r.get('error')
          assert r['isolatedSyntheticFixture'] is True
          assert r['ownerNativeScan'] is False
          assert r['r1Accepted'] is False and r['eligibleForLease'] is False
          assert len(r['checks'])==7
          assert r['workerGenerationChanged'] is True
          print('PASS actual Chromium MV3 killed during source scan; fresh scans deny replay')
          PY
          echo "KR_CHROME_BINARY=$KR_CHROME_BINARY" >> "$GITHUB_ENV"
          echo "KR_E2E_BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"
      - name: Exact archived v1.25.21 product ZIP unchanged and packaged Chromium 9/9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-real-mv3/pack" "$RUNNER_TEMP/kar171-real-mv3/unpacked"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-real-mv3/pack"
          ZIP="$RUNNER_TEMP/kar171-real-mv3/pack/kleinanzeigen-renewal-chrome-v1.25.21.zip"
          cmp "$ZIP" release/kleinanzeigen-renewal-chrome-v1.25.21.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "c6aa24e84c167b741718e58f27b048cd2d2b20c9dca48983c9ce60482e883693"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kar171-real-mv3/unpacked"
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar171-real-mv3/unpacked"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar171-real-mv3/default-e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'kar171-real-mv3'/'default-e2e.json'
          r=json.loads(p.read_text())
          assert r['scenarioCount']==9 and r['passed']==9
          assert r['failed']==0 and r['cleanupFailed']==0
          print('PASS 9/9 packaged Chromium default suite; unchanged owner v1.25.21 ZIP')
          PY
      - name: Upload non-sensitive synthetic proof only
        uses: actions/upload-artifact@v4
        with:
          name: kar171-r1-isolated-mv3-inflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kar171-real-mv3/inflight-report.json
            ${{ runner.temp }}/kar171-real-mv3/default-e2e.json
          retention-days: 30
          if-no-files-found: error
