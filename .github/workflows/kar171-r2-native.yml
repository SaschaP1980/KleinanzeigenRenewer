name: KAR-171 R2 NativeHost transaction oracle (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/windows-native-host-wave1.ps1
      - tools/windows/KleinanzeigenRenewer.NativeHost.cs
      - .github/workflows/kar171-r2-native.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KAR_UPDATER_TEST_MODE: '1'
      KAR_NATIVE_HOST_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Native executable on authentic Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-native-host-wave1.ps1

  full-gate:
    name: Runtime, coverage and architecture against final clean tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci
      - name: Complete safety and coverage gate (exclude disposable workflow)
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kar171-r2-native.yml
          bash scripts/coverage-gate.sh
