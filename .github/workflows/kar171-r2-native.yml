name: KAR-171 R2 NativeHost transaction oracle (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/windows-native-host-wave1.ps1
      - tools/windows/KleinanzeigenRenewer.NativeHost.cs
      - .github/workflows/kar171-r2-native.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KAR_UPDATER_TEST_MODE: '1'
      KAR_NATIVE_HOST_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Native executable on authentic Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-native-host-wave1.ps1
