name: KAR-171 exact main into Work merge (one-shot)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: write
concurrency:
  group: kar171-one-time-main-into-work
  cancel-in-progress: false
jobs:
  merge_and_package:
    name: Safe exact-SHA upstream merge, v1.25.13 preview, regression and Work push
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard one-shot authorization, exact Work HEAD and upstream SHA
        shell: bash
        env:
          EXPECTED_MAIN: a267caabd53427aa7378be5017787ab32e7c88bd
          ARM_MESSAGE: "ci(KAR-171): arm exact upstream main merge into v1.25.13 Work preview"
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "$ARM_MESSAGE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)" = "$GITHUB_SHA"
          echo "EXPECTED_WORK_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_MAIN=$EXPECTED_MAIN" >> "$GITHUB_ENV"
          echo "KAR171_UPSTREAM_LEASE_VERIFIED"
      - name: Merge exact current main into existing Work, preserving reviewed R1 guards
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          set +e
          git -c user.email=kar-ci@example.invalid -c user.name=KAR-CI merge --no-commit --no-ff "$EXPECTED_MAIN"
          status=$?
          set -e
          test "$status" -eq 1
          python3 docs/maintenance/KAR171_MAIN_SYNC_RESOLVER.py
          # Never integrate disposable Work-only CI workflows.
          git rm -f .github/workflows/kar171-upstream-drymerge.yml
          git rm -f .github/workflows/kar171-upstream-integrated-validation.yml
          git rm -f .github/workflows/kar171-upstream-merge-once.yml
          python3 docs/maintenance/KAR171_PREVIEW_VERSION.py
          git add manifest.json package.json package-lock.json release/release-spec.json CHANGELOG.md tests/current-patch-policy-regression.cjs
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          node -e "const p=require('./package.json'),m=require('./manifest.json');if(p.version!=='1.25.13'||m.version!==p.version)process.exit(1)"
          echo "KAR171_MAIN_MERGE_PREPARED"
      - name: Install locked Node dependencies
        run: npm ci
      - name: Create exact v1.25.13 archived Chrome ZIP before parity and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py "$RUNNER_TEMP/kar171-preview"
          ZIP="release/kleinanzeigen-renewal-chrome-v1.25.13.zip"
          test ! -e "$ZIP"
          cp "$RUNNER_TEMP/kar171-preview/kleinanzeigen-renewal-chrome-v1.25.13.zip" "$ZIP"
          git add -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          python3 scripts/verify_committed_chrome_zip.py --base-sha "$EXPECTED_MAIN"
          echo "WORK_PREVIEW_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)"
          echo "WORK_PREVIEW_SIZE=$(stat -c %s "$ZIP")"
      - name: Mandatory complete regression, architecture, source/API and coverage gates
        run: bash scripts/coverage-gate.sh
      - name: Recheck source, commit actual two-parent merge, push ONLY Work branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)" = "$EXPECTED_WORK_HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git -c user.name='KAR GitHub CI' -c user.email='kar-ci@example.invalid' commit -m 'merge(KAR-171): integrate main v1.25.12 and archive v1.25.13 Work preview'
          python3 - <<'PY'
          import subprocess,os
          parents=subprocess.check_output(['git','rev-list','--parents','-n','1','HEAD'],text=True).strip().split()
          assert len(parents)==3,parents
          assert parents[1]==os.environ['EXPECTED_WORK_HEAD'],parents
          assert parents[2]==os.environ['EXPECTED_MAIN'],parents
          print('KAR171_VERIFIED_TWO_PARENT_MERGE',*parents)
          PY
          # Normal fast-forward only, never force; rejects concurrent owner work.
          git push origin HEAD:refs/heads/work/KAR-171
          NEW="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)" = "$NEW"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          echo "KAR171_UPSTREAM_MERGED_WORK_ONLY_SHA=$NEW"
      - name: Preserve installable v1.25.13 Work preview ZIP as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigen-renewal-v1.25.13-kar171-work-preview
          path: release/kleinanzeigen-renewal-chrome-v1.25.13.zip
          if-no-files-found: error
          retention-days: 14
