name: KAR-171 R1 publish lineage (temporary)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: read
jobs:
  r1_publish_lineage:
    name: R1 original publish provenance and matched renewal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: P8 immutable publish lineage targeted negative matrix
        run: node tests/kar171-r1-publish-lineage-preflight.cjs
      - name: Remove disposable CI workflow before full regression
        run: rm .github/workflows/kar171-r1-publish-lineage.yml
      - name: Full regression and safety, architecture, coverage gates
        run: bash scripts/coverage-gate.sh
