name: KAR-171 R1 conditional MV3 watchdog RED
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar171-r1-mv3-watchdog-idle.cjs
