name: KAR-171 W3D1 temporary 15-owner closure matrix

on:
  push:
    branches: [work/KAR-171]

permissions:
  contents: read

jobs:
  focused:
    name: W3D1 independently witnessed owner closure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused real owner observer regression
        run: node tests/kar99-p7-integrated-owner-authority.cjs
