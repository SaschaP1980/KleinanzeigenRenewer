name: KAR-214 full successor gate (temporary)
on:
  push:
    branches: ['work/KAR-214']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Compare exact public API identities against pinned 2.0.0.1
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/kar214-predecessor"
          mkdir -p "$BASE"
          git archive 3457cc52fbd90515d47fa4a4c180fde6361b1f27 src scripts | tar -x -C "$BASE"
          ln -s "$PWD/node_modules" "$BASE/node_modules"
          node "$BASE/scripts/runtime-api-inventory.cjs" --json > "$RUNNER_TEMP/before.json"
          node scripts/runtime-api-inventory.cjs --json > "$RUNNER_TEMP/after.json"
          python3 - <<'PY'
          import json, os, collections
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          def items(name):
              j=json.loads((root/name).read_text())
              return j['modules'], collections.Counter((f['module'],f['owner'],f['name']) for f in j['functions'])
          bm,b=items('before.json'); am,a=items('after.json')
          added=a-b; removed=b-a
          print('KAR214_API_DELTA',json.dumps({'before':sum(b.values()),'after':sum(a.values()),'added':list(added.elements()),'removed':list(removed.elements()),'moduleAdded':sorted(set(am)-set(bm)),'moduleRemoved':sorted(set(bm)-set(am))}))
          assert sum(b.values())==811 and sum(a.values())==821
          assert not removed and sum(added.values())==10
          assert set(am)-set(bm)=={'src/app/trash-retention-settings-controller.js'} and not set(bm)-set(am)
          PY
      - name: Mandatory coverage and architecture gate
        run: bash scripts/coverage-gate.sh
      - name: Reproducible Chrome package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py "$RUNNER_TEMP/build1"
          python3 scripts/package.py "$RUNNER_TEMP/build2"
          Z=kleinanzeigen-renewal-chrome-v2.0.1.0.zip
          cmp "$RUNNER_TEMP/build1/$Z" "$RUNNER_TEMP/build2/$Z"
          unzip -t "$RUNNER_TEMP/build1/$Z" >/dev/null
          sha256sum "$RUNNER_TEMP/build1/$Z"
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); print("KAR214_ZIP_ENTRIES",len(z.namelist())); assert len(z.namelist())==125 and "manifest.json" in z.namelist()' "$RUNNER_TEMP/build1/$Z"
      - uses: actions/upload-artifact@v4
        with:
          name: kar214-chrome-and-evidence
          path: |
            ${{ runner.temp }}/build1/*.zip
            coverage/coverage-summary.json
            coverage/architecture-audit.json
          retention-days: 14
