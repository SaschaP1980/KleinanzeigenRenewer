name: KAR-222 registry local metadata correctness
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-registry-temp.yml','tests/kar222-tab-registry-cost.cjs','src/background/services/tab-registry.js']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and scope
        run: |
          git diff --name-status 025b99b6bfba03666c52f057cd45c26b26b2b386 HEAD
          git diff --exit-code 025b99b6bfba03666c52f057cd45c26b26b2b386 HEAD -- manifest.json lib icons
          node --check src/background/services/tab-registry.js
          node --check tests/kar222-tab-registry-cost.cjs
      - name: Registry behavior and costs
        run: node --test --test-reporter=tap tests/kar210-p9-independent-tab-lifecycle.cjs tests/kar222-tab-registry-cost.cjs
      - name: Adjacent retained registry commands
        if: always()
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node tests/v1156-a1-tab-registry-runtime.cjs
          node tests/v1156-a1-tab-registry.cjs
      - name: Retained renewal and roster witnesses
        if: always()
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node --test --test-reporter=tap tests/kar222-roster-scan-cost.cjs tests/kar199-phase4-ui-runtime.cjs tests/kar222-b16-recovery-ui.cjs tests/kar199-emergency-reset-candidate-recovery.cjs tests/kar222-b14-recovery.cjs tests/kar210-kar199-baseline-reset.cjs tests/kar222-delete-no-replay.cjs tests/kar199-phase4-no-transport-replay.cjs tests/kar210-kar199-baseline-phase4.cjs tests/kar210-cp36-phase4-product-witness.cjs tests/kar210-kar150-mass-baseline.cjs tests/kar210-kar150-uncertain-start-witness.cjs tests/kar222-mass-recovery-witness.cjs tests/kar210-cp38-publish-uncertainty-witness.cjs tests/kar210-cp36-phase4-unknown-witness.cjs tests/kar222-publication-identity-witness.cjs
