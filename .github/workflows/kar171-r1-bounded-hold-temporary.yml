name: KAR-171 R1 deterministic bounded content hold contract
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  bounded-hold:
    if: contains(github.event.head_commit.message, 'KAR171-R1-HOLD-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test-first original P8-bound content-side 45s hold
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/kar171-r1-production-content-witness.cjs
      - name: Source-level scope and focused replay gates (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-HOLD-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kar171-r1-interruption-replay-integration.cjs
          node --test tests/kar171-r1-independent-content-pending-monitor.cjs
          node --check src/content/inventory-runner.js
          node --check src/background/services/remote-delete-replacement-service.js
          node --check src/background/services/additional-owner-observer.js
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
