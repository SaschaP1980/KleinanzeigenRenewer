# Temporary, one-time repair of the already-published v1.23.22 Markdown release notes.
# No tag, asset, runtime, ZIP or product mutation is authorized by this workflow.
name: KAR-18 Release Notes Repair Once

on:
  workflow_run:
    workflows:
      - KAR CI
    types:
      - completed

concurrency:
  group: kar-18-release-notes-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: >-
      ${{ github.repository == 'SaschaP1980/KleinanzeigenRenewer' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact one-time maintenance commit and successful same-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "KAR18_NOTES_REPAIR_PRECHECK_FAILED line=$LINENO command=$BASH_COMMAND" >&2' ERR
          BASE_SHA='d93e46952784b7550a76baf14eeae9a9e8ac2870'
          AUTH_MESSAGE='fix: literal release notes and retire consumed dispatcher'
          git init -q audit
          cd audit
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=2 origin "$HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git show -s --format=%s "$HEAD_SHA")" = "$AUTH_MESSAGE"
          ACTUAL="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" | LC_ALL=C sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/kar-release.yml' \
            '.github/workflows/kar-release-dispatch-once.yml' \
            '.github/workflows/kar-release-notes-repair-once.yml' \
            'package.json' 'scripts/release-notes.sh' 'tests/kar-release-notes-contract.cjs' | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" | grep -Fx $'D\t.github/workflows/kar-release-dispatch-once.yml'
          test "$(git show "$HEAD_SHA:manifest.json" | jq -r .version)" = '1.23.22'
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$HEAD_SHA"
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg sha "$HEAD_SHA" '
            .head_sha == $sha and .head_branch == "main" and
            .name == ("KAR CI main @ " + $sha) and
            .path == ".github/workflows/kar-ci.yml" and
            .event == "push" and .status == "completed" and .conclusion == "success"
          ' <<< "$CI" >/dev/null
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.conclusion == "success" and
             .name == "Runtime, safety, coverage, Chrome ZIP and packaged browser E2E" and
             ([.steps[] | select(.name == "Full runtime / safety / coverage gate" or
                                  .name == "Build installable Chrome ZIP" or
                                  .name == "Packaged browser E2E (local fixtures only)") |
               .conclusion] == ["success","success","success"]))] | length == 1' <<< "$JOBS" >/dev/null
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.23.22")"
          jq -e --arg target "$BASE_SHA" \
                --arg digest 'sha256:d4f6af40b9634c6cf97c9e74015f645ea9df5d705ecf6f573680b36b615da442' '
            .tag_name == "v1.23.22" and .target_commitish == $target and
            .draft == false and .prerelease == false and
            (.assets | length == 1) and
            .assets[0].name == "kleinanzeigen-renewal-chrome-v1.23.22.zip" and
            .assets[0].size == 751444 and .assets[0].digest == $digest
          ' <<< "$RELEASE" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.23.22" --jq .object.sha)" = "$BASE_SHA"
          git show "$HEAD_SHA:scripts/release-notes.sh" > "$RUNNER_TEMP/kar-release-notes.sh"
          VERSION=1.23.22 MODE=fast GITHUB_SHA="$BASE_SHA" ZIP_BYTES=751444 \
            ZIP_SHA256='d4f6af40b9634c6cf97c9e74015f645ea9df5d705ecf6f573680b36b615da442' \
            bash "$RUNNER_TEMP/kar-release-notes.sh" > "$RUNNER_TEMP/kar-release-notes.md"
          test -s "$RUNNER_TEMP/kar-release-notes.md"
          OLD_BODY="$(jq -r .body <<< "$RELEASE")"
          if [ "$OLD_BODY" != "$(cat "$RUNNER_TEMP/kar-release-notes.md")" ]; then
            # This operation edits exactly one field: the release body.
            gh release edit v1.23.22 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/kar-release-notes.md"
          fi
          NEW_RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.23.22")"
          diff -u "$RUNNER_TEMP/kar-release-notes.md" <(jq -r '.body + "\n"' <<< "$NEW_RELEASE")
          jq -e --arg target "$BASE_SHA" \
                --arg digest 'sha256:d4f6af40b9634c6cf97c9e74015f645ea9df5d705ecf6f573680b36b615da442' '
            .target_commitish == $target and (.assets | length == 1) and
            .assets[0].digest == $digest and .assets[0].size == 751444
          ' <<< "$NEW_RELEASE" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.23.22" --jq .object.sha)" = "$BASE_SHA"
          echo "KAR18_RELEASE_NOTES_REPAIRED_AND_READBACK sha=$BASE_SHA asset_sha256=d4f6af40b9634c6cf97c9e74015f645ea9df5d705ecf6f573680b36b615da442"
