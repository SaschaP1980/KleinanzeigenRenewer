name: KAR-171 R1 bounded content hold v1.25.23 Work-only package
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: write
jobs:
  build-work-only:
    if: contains(github.event.head_commit.message, 'KAR171-R1-HOLD-PACKAGE-START')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed Work-only identity and exact source preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/KAR-171"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "a267caabd53427aa7378be5017787ab32e7c88bd"
          test ! -e release/kleinanzeigen-renewal-chrome-v1.25.23.zip
          test -f release/kleinanzeigen-renewal-chrome-v1.25.22.zip
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          p=json.loads(Path('package.json').read_text())
          lock=json.loads(Path('package-lock.json').read_text())
          spec=json.loads(Path('release/release-spec.json').read_text())
          assert m['version']==p['version']==lock['version']==lock['packages']['']['version']==spec['version']==spec['packageVersion']=='1.25.23'
          assert p['displayVersion']=='1.25.23'
          assert set(m['permissions'])=={'activeTab','storage','unlimitedStorage','scripting','nativeMessaging'}
          assert 'docs/testing/KAR171_R1_CONTROLLED_SOURCE_HOLD_READ_ONLY.js' in [
            str(x) for x in Path('docs/testing').glob('KAR171_R1_CONTROLLED_SOURCE_HOLD_READ_ONLY.js')
          ]
          print('PASS unpublished Work-only identity; no updater, Chrome install, listing mutation or release')
          PY
      - name: Build exact versioned Chrome ZIP and validate immutable owner legacy ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-v12523/pack" "$RUNNER_TEMP/kar171-v12523/unpacked"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-v12523/pack"
          ZIP="$RUNNER_TEMP/kar171-v12523/pack/kleinanzeigen-renewal-chrome-v1.25.23.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          python3 - "$ZIP" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          z=Path(sys.argv[1])
          with zipfile.ZipFile(z) as archive:
            m=json.loads(archive.read('manifest.json'))
            assert m['version']=='1.25.23'
          old=Path('release/kleinanzeigen-renewal-chrome-v1.25.22.zip')
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='f9d5608cea0a455822d6f918ecdc79321bda78681021ebccdd530ea48a703f19'
          print('PASS v1.25.23 Work package; v1.25.22 owner archive preserved')
          PY
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kar171-v12523/unpacked"
          # Commit only the versioned ZIP LOCALLY before source/coverage checks,
          # which require the exact current archive to be present and tracked.
          # The remote Work ref is updated only AFTER all gates pass.
          cp "$ZIP" release/kleinanzeigen-renewal-chrome-v1.25.23.zip
          git add -f -- release/kleinanzeigen-renewal-chrome-v1.25.23.zip
          test "$(git diff --cached --name-only)" = "release/kleinanzeigen-renewal-chrome-v1.25.23.zip"
          git -c user.name='KAR Work-only CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build(KAR-171): archive source-exact Work-only v1.25.23 Chrome ZIP"
          echo "WORK_ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Full source/coverage/architecture and registered security regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar171-r1-work-v12523-package-temporary.yml
          bash scripts/coverage-gate.sh
          git restore .github/workflows/kar171-r1-work-v12523-package-temporary.yml
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Mandatory packaged isolated Chromium 9/9
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export KR_E2E_BROWSER_CHANNEL=chromium
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar171-v12523/unpacked"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar171-v12523/e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-v12523'/'e2e.json').read_text())
          assert r['scenarioCount']==9 and r['passed']==9 and r['failed']==0 and r['cleanupFailed']==0,r
          print('PASS v1.25.23 Work-only packaged Chromium 9/9')
          PY
      - name: Commit exactly one Work-only ZIP, verify source parity, fast-forward and read back
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/KAR-171"
          test "$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          # The unique archive is already locally COMMITTED; no untested push.
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "release/kleinanzeigen-renewal-chrome-v1.25.23.zip"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 scripts/verify_committed_chrome_zip.py --report "$RUNNER_TEMP/kar171-v12523/parity.json"
          git push origin HEAD:refs/heads/work/KAR-171
          ACTUAL="$(git ls-remote origin refs/heads/work/KAR-171 | cut -f1)"
          test "$ACTUAL" = "$(git rev-parse HEAD)"
          git show --format=fuller --stat HEAD
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('release/kleinanzeigen-renewal-chrome-v1.25.23.zip')
          r={'version':'1.25.23','sourceOnly':False,
             'workOnly':True,'mainMerged':False,'released':False,
             'ownerNativeScan':False,'r1Accepted':False,'eligibleForLease':False,
             'zipBytes':p.stat().st_size,'zipSha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          dest=Path(os.environ['RUNNER_TEMP'])/'kar171-v12523'/'build.json'
          dest.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r))
          PY
      - name: Upload WORK-only parity and browser reports (never a release)
        uses: actions/upload-artifact@v4
        with:
          name: kar171-r1-unpublished-v12523-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kar171-v12523/build.json
            ${{ runner.temp }}/kar171-v12523/parity.json
            ${{ runner.temp }}/kar171-v12523/e2e.json
          retention-days: 30
          if-no-files-found: error

# Disposable v1.25.23 Work-only builder, never main merge, Release or owner install.
# No remote Kleinanzeigen or native Windows mutation. Delete after exact GREEN.
