name: KAR-171 R1 staged account witness (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tests/kar99-phase4-outcome-reconciliation.cjs
      - tests/kar99-publish-outcome.cjs
      - src/background/services/additional-owner-observer.js
      - src/background/services/auto-publish-intent-journal.js
      - src/background/services/phase4-uncertainty-journal.js
      - src/background/background.js
      - tests/v12319-version-architecture.cjs
      - tests/v12320-final-closure.cjs
      - .github/workflows/kar171-r1-stage.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci
      - name: R1 source, publication and P8 lineage regressions
        run: |
          node tests/kar99-phase4-outcome-reconciliation.cjs
          node tests/kar99-publish-outcome.cjs
          node --test tests/kar99-p13f2e2d2a-remote-admission-lineage.cjs
          node tests/kar175-publish-intent-authorization.cjs
      - name: Complete final-tree safety, runtime, coverage, architecture gate
        shell: bash
        run: |
          rm .github/workflows/kar171-r1-stage.yml
          bash scripts/coverage-gate.sh
