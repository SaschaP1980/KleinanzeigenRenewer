name: KAR-43 One-Time Historical Version Map Harmonization
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kar-43-version-map-once.yml'
permissions:
  contents: write
jobs:
  migrate-current-version-map-keys:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/KAR-43'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/KAR-43
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add only 1.23.24 mapping values inherited unchanged from 1.23.23
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          old="1.23.23"
          new="1.23.24"
          pattern=re.compile(r"""(?P<q>['"])1\.23\.23(?P=q)(?P<colon>\s*:\s*)(?P<value>'[^']*'|"[^"]*"|null|true|false)(?P<end>\s*[,}])""")
          touched=[]
          for f in sorted(pathlib.Path("tests").rglob("*")):
            if f.suffix not in (".js",".cjs",".mjs") or not f.is_file():
              continue
            source=f.read_text(encoding="utf-8")
            def change(match):
              tail=match.group("end")
              q=match.group("q")
              return (match.group(0)[:-len(tail)] + "," + q + new + q + match.group("colon") + match.group("value") + tail)
            target,count=pattern.subn(change,source)
            if count:
              f.write_text(target,encoding="utf-8")
              touched.append((str(f),count))
          if not touched:
            raise SystemExit("No historical version-map entries eligible; refusing no-op")
          print("KAR43_VERSION_MAP_UPDATES_BEGIN")
          for f,n in touched: print(f"{f}: {n} new version keys")
          print("KAR43_VERSION_MAP_UPDATES_END")
          print("KAR43_VERSION_MAP_TOTAL",len(touched),sum(n for _,n in touched))
          PY
      - name: Validate full existing mandatory npm regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          bash scripts/coverage-gate.sh
      - name: Commit test-only update and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests
          git rm -- .github/workflows/kar-43-version-map-once.yml
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          if not changed or any(x!=".github/workflows/kar-43-version-map-once.yml" and not x.startswith("tests/") for x in changed):
            raise SystemExit("Unexpected changed file(s): "+repr(changed))
          print("KAR43_VERSION_MAP_COMMIT_FILES",len(changed))
          PY
          git commit -m 'test(KAR-43): map v1.23.24 to unchanged historical patch evidence'
          git push origin HEAD:refs/heads/work/KAR-43
          echo 'KAR43_VERSION_MAP_SUCCESS'
