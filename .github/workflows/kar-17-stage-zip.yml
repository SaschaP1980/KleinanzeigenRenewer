# KAR-17 one-shot, self-removing packaging bridge. This never publishes a Release.
name: KAR-17 temporary exact-source ZIP staging

on:
  push:
    branches:
      - work/KAR-17

permissions:
  contents: write

jobs:
  stage:
    name: Stage exact 1.23.49 Chrome ZIP without a release
    if: github.repository == 'SaschaP1980/KleinanzeigenRenewer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Safely stage and validate exactly one ZIP, then remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/KAR-17"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./manifest.json').version")" = "1.23.49"
          test "$(node -p "require('./package.json').version")" = "1.23.49"
          test ! -e release/kleinanzeigen-renewal-chrome-v1.23.49.zip
          python3 scripts/package.py "$RUNNER_TEMP/kar17-build"
          ZIP="$RUNNER_TEMP/kar17-build/kleinanzeigen-renewal-chrome-v1.23.49.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          cp "$ZIP" release/kleinanzeigen-renewal-chrome-v1.23.49.zip
          python3 scripts/verify_committed_chrome_zip.py --base-sha f2225155e403d89d07a674c9e20f397a4f86694d
          git rm .github/workflows/kar-17-stage-zip.yml
          git add -f release/kleinanzeigen-renewal-chrome-v1.23.49.zip
          DIFF="$(git diff --cached --name-only)"
          EXPECTED="$(printf '.github/workflows/kar-17-stage-zip.yml\nrelease/kleinanzeigen-renewal-chrome-v1.23.49.zip')"
          test "$DIFF" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(KAR-17): stage exact verified v1.23.49 ZIP and retire one-shot workflow"
          git push origin HEAD:refs/heads/work/KAR-17
