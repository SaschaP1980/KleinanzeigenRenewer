name: KAR-171 W3D3A isolated origin-lock safety proof (temporary)

on:
  push:
    branches: [work/KAR-171]

permissions:
  contents: read

jobs:
  focused:
    name: W3D3A 15-owner origin-lock RED-GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay competing MV3 workers against actual Web Lock owner capture
        shell: bash
        run: |
          set -euo pipefail
          node tests/kar99-p8-adversarial-races.cjs
      - name: Install complete test dependencies
        run: npm ci
      - name: Full regression and architecture coverage on final clean source tree
        shell: bash
        run: |
          set -euo pipefail
          # W3D3A temporary workflow does not belong in KAR-167's
          # strict repository inventory, so test its final cleanup state.
          rm .github/workflows/kar171-w3d3a-focused.yml
          bash scripts/coverage-gate.sh
