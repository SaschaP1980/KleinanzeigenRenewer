name: KAR-171 R1 integration interruption restart and replay checkpoint
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  r1-integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency lock
        run: npm ci
      - name: Run real observer and remote scanner integration + existing R1 tests
        run: |
          node --test tests/kar171-r1-interruption-replay-integration.cjs
          node --test tests/kar171-r1-native-account-proof.cjs
          node --test tests/kar171-r1-fresh-tab-readiness.cjs
      - name: Full safety, architecture and coverage closure
        run: |
          rm .github/workflows/kar171-r1-integration-temporary.yml
          bash scripts/coverage-gate.sh
      - name: Verify no runtime artifact changed from owner-verified v1.25.20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-r1-testonly"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-r1-testonly"
          SHA="$(sha256sum "$RUNNER_TEMP/kar171-r1-testonly/kleinanzeigen-renewal-chrome-v1.25.20.zip" | cut -d' ' -f1)"
          test "$SHA" = "a861b5d1794ff4f7c284d493cb8f1cd9653537759fb70f356bf13ea61f916734"
          cmp "$RUNNER_TEMP/kar171-r1-testonly/kleinanzeigen-renewal-chrome-v1.25.20.zip" release/kleinanzeigen-renewal-chrome-v1.25.20.zip
          echo "PASS unchanged native-owner v1.25.20 runtime ZIP $SHA"
