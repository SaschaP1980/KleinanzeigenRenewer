name: KAR-210 CP40 historical test comparison
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp40-historical-comparison.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f2225155e403d89d07a674c9e20f397a4f86694d
          path: historical
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: work
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies without lifecycle scripts
        run: |
          (cd historical && npm ci --ignore-scripts)
          (cd work && npm ci --ignore-scripts)
      - name: Compare original tests on historical and restored source
        env:
          EXPECTED_WORK: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, pathlib, subprocess, hashlib, shutil, re
          historical=pathlib.Path('historical').resolve()
          work=pathlib.Path('work').resolve()
          def sha(root):
              return subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert sha(historical)=='f2225155e403d89d07a674c9e20f397a4f86694d'
          assert sha(work)==os.environ['EXPECTED_WORK']
          plan=json.loads((work/'docs/maintenance/KAR210_CP40_SCOPE_COMPARISON.json').read_text())
          rows=[x for x in plan['remainingRows'] if x['historicalSuite']]
          assert len(rows)==8
          results=[]
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in rows:
              p=row['path']
              original=(historical/p).read_bytes()
              assert blob(original)==row['historicalBlob']
              assert blob((work/p).read_bytes())==row['workBlob']
              for kind,root in [('historical-original',historical),('work-original',work)]:
                  target=root/p
                  previous=target.read_bytes()
                  try:
                      if kind=='work-original': target.write_bytes(original)
                      try:
                          proc=subprocess.run(['node',p],cwd=root,env=env,text=True,capture_output=True,timeout=90)
                          rc=proc.returncode
                          out=proc.stdout+'\n'+proc.stderr
                      except subprocess.TimeoutExpired as exc:
                          rc=124
                          out=str(exc)
                      record=dict(index=row['index'],path=p,basis=kind,exitCode=rc,status='PASS' if rc==0 else 'TIMEOUT' if rc==124 else 'FAIL',evidence=[s.strip()[:500] for s in out.splitlines() if re.search(r'AssertionError|Error:|not ok|FAIL|expected|actual',s,re.I)][:8])
                      print('CP40_ROW '+json.dumps(record),flush=True)
                      results.append(record)
                      pathlib.Path('/tmp',f"cp40-{row['index']}-{kind}.log").write_text(out)
                  finally:
                      if kind=='work-original': target.write_bytes(previous)
          assert len(results)==16
          print('CP40_RESULTS '+json.dumps(results),flush=True)
          for kind in ['historical-original','work-original']:
              print('CP40_COUNTS '+kind+' '+json.dumps({s:sum(x['basis']==kind and x['status']==s for x in results) for s in ['PASS','FAIL','TIMEOUT']}),flush=True)
          assert subprocess.check_output(['git','diff','--name-only'],cwd=work,text=True)=='' 
          # Diagnostic results are not a gate or PASS certification; failures remain visible.
          raise SystemExit(any(x['status']!='PASS' for x in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kar210-cp40-historical-comparison
          path: /tmp/cp40-*.log
          retention-days: 14
