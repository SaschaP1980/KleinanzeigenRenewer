# One-time, owner-authorized restoration of v1.23.23 Chrome ZIP in main/release.
# No tag, release asset, package/runtime or account mutation.
name: KAR-21 v1.23.23 Repo ZIP Backfill Once

on:
  workflow_run:
    workflows:
      - KAR CI
    types:
      - completed

concurrency:
  group: kar-21-v12323-repo-zip-once
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: read

jobs:
  backfill:
    if: >-
      ${{ github.repository == 'SaschaP1980/KleinanzeigenRenewer' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Verify single-use provenance, exact CI and immutable published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          trap 'echo "KAR21_BACKFILL_PRECHECK_FAILED line=$LINENO command=$BASH_COMMAND" >&2' ERR
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = 'f9d39a9332b9041fd18a9153282705af898873ce'
          test "$(git show -s --format=%s HEAD)" = 'fix(release): archive published Chrome ZIP in repository'
          ACTUAL="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" | LC_ALL=C sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/kar-release.yml' \
            '.github/workflows/kar-21-repo-zip-once.yml' 'scripts/archive-release-zip.sh' \
            'tests/kar-release-repo-archive-contract.cjs' 'package.json' \
            'docs/RELEASE_PROCESS.md' 'docs/GITHUB_HOWTO.md' | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          test "$(jq -r '.version' manifest.json)" = '1.23.23'
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/issues/21" --jq .state)" = 'open'
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg sha "$HEAD_SHA" '
            .head_sha == $sha and .head_branch == "main" and
            .name == ("KAR CI main @ " + $sha) and
            .path == ".github/workflows/kar-ci.yml" and
            .event == "push" and .status == "completed" and .conclusion == "success"
          ' <<< "$CI" >/dev/null
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.conclusion == "success" and
            .name == "Runtime, safety, coverage, Chrome ZIP and packaged browser E2E" and
            ([.steps[] | select(.name == "Full runtime / safety / coverage gate" or
                .name == "Build installable Chrome ZIP" or
                .name == "Packaged browser E2E (local fixtures only)") | .conclusion]
               == ["success","success","success"]))] | length == 1' <<< "$JOBS" >/dev/null
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.23.23")"
          jq -e --arg sha '11cc538912415209eb86e9973f951e4a18387e29' --arg dig 'sha256:2d98ea27657ed0dfafee1e61649970dade2b92445289674044f63bf9352d9cb7' '
            .target_commitish == $sha and .draft == false and .prerelease == false and
            (.assets | length == 1) and
            .assets[0].name == "kleinanzeigen-renewal-chrome-v1.23.23.zip" and
            .assets[0].size == 751444 and .assets[0].digest == $dig
          ' <<< "$RELEASE" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.23.23" --jq .object.sha)" = '11cc538912415209eb86e9973f951e4a18387e29'
          test ! -e release/kleinanzeigen-renewal-chrome-v1.23.23.zip
          echo "KAR21_BACKFILL_AUTHORIZED ci=$CI_RUN_ID sha=$HEAD_SHA"
      - name: Download and commit the published ZIP unchanged under main/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          NAME='kleinanzeigen-renewal-chrome-v1.23.23.zip'
          mkdir -p "$RUNNER_TEMP/kar-21-asset"
          gh release download v1.23.23 --repo "$GITHUB_REPOSITORY" \
            --pattern "$NAME" --dir "$RUNNER_TEMP/kar-21-asset"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          bash scripts/archive-release-zip.sh \
            "$RUNNER_TEMP/kar-21-asset/$NAME" 1.23.23 \
            '2d98ea27657ed0dfafee1e61649970dade2b92445289674044f63bf9352d9cb7' 751444 '11cc538912415209eb86e9973f951e4a18387e29'
      - name: Trigger mandatory exact-main post-archive CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          POST="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$POST" != 'f9d39a9332b9041fd18a9153282705af898873ce'
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/release/kleinanzeigen-renewal-chrome-v1.23.23.zip" --jq .size)" = 751444
          gh workflow run kar-ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "KAR21_POST_ARCHIVE_CI_DISPATCH_ACCEPTED sha=$POST"
