name: KAR-210 CP20 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp20-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v180-renewal.cjs tests/v181-contract.cjs tests/v182-contract.cjs tests/v183-contract.cjs tests/v184-contract.cjs tests/v185-contract.cjs tests/v186-contract.cjs tests/v187-contract.cjs tests/v188-contract.cjs tests/v189-contract.cjs tests/v1810-contract.cjs tests/v1811-contract.cjs tests/v1812-contract.cjs tests/v1813-contract.cjs tests/v1814-contract.cjs tests/kar210-loading-retention-baseline.cjs tests/kar210-kar175-public-navigation-baseline.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP20_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP20_PASS $f"; else echo "CP20_FAIL $f"; failed=1; fi
          done
          exit "$failed"
