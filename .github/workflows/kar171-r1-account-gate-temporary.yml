name: KAR-171 R1 bounded account identity gate validation
on:
  push:
    branches:
      - work/KAR-171
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1-account-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar171-r1-native-account-proof.cjs
