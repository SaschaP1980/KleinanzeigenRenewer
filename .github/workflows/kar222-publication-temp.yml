name: KAR-222 C D1 E focused
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-publication-temp.yml','tests/kar222-publication-identity-witness.cjs']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Scoped runtime diff and syntax
        run: |
          git diff --name-status e2065e0b395240aebe4e95abc0842c6cda4bcb7b HEAD
          git diff --exit-code e1b91784d2316241d71d2c7fac1aef8ecaa1fe20 HEAD -- manifest.json lib icons
          git diff --name-only e1b91784d2316241d71d2c7fac1aef8ecaa1fe20 HEAD -- src | while read -r f; do node --check "$f"; done
          node --check tests/kar222-publication-identity-witness.cjs
      - name: Prior GREEN and publication identity witnesses
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node --test --test-reporter=tap tests/kar199-phase4-ui-runtime.cjs tests/kar222-b16-recovery-ui.cjs tests/kar199-emergency-reset-candidate-recovery.cjs tests/kar222-b14-recovery.cjs tests/kar210-kar199-baseline-reset.cjs tests/kar222-delete-no-replay.cjs tests/kar199-phase4-no-transport-replay.cjs tests/kar210-kar199-baseline-phase4.cjs tests/kar210-cp36-phase4-product-witness.cjs tests/kar210-kar150-mass-baseline.cjs tests/kar210-kar150-uncertain-start-witness.cjs tests/kar222-mass-recovery-witness.cjs tests/kar210-cp38-publish-uncertainty-witness.cjs tests/kar210-cp36-phase4-unknown-witness.cjs tests/kar222-publication-identity-witness.cjs
      - name: Retained adjacent product regression commands
        if: always()
        run: |
          set +e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          failed=0
          for f in tests/v1176-trash-template-publish-runtime.cjs tests/v1177-performance4-phase4.cjs tests/v1178-phase3-public-url.cjs tests/v12013-phase3-public-verification.cjs tests/v12016-phase3-public-readiness.cjs tests/v12019-phase3-edit-authority.cjs tests/v12214-emergency-reset-ui.cjs tests/v12222-emergency-reset-regression.cjs tests/v12223-emergency-reset-activity-regression.cjs tests/v12226-paid-insertion-regression.cjs tests/v12226-paid-insertion-diagnostic-placement.cjs tests/v12227-paid-insertion-lock-reset-regression.cjs tests/v12228-legacy-emergency-reset-regression.cjs tests/v12230-global-emergency-reset.cjs tests/v1231-renewal-workflow-modularization.cjs tests/v1231-renewal-workflow-runtime.cjs tests/v1233-mass-renewal-workflow-modularization.cjs tests/v1233-mass-renewal-workflow-runtime.cjs tests/v1235-terminal-template-emergency-reset.cjs tests/v12317-template-filler-modularization.cjs tests/v12317-template-filler-runtime.cjs; do
            node "$f"
            rc=$?
            echo "KAR222_RETAINED_COMMAND $f rc=$rc"
            if [ "$rc" -ne 0 ]; then failed=$((failed+1)); fi
          done
          echo "KAR222_RETAINED_NONZERO=$failed"
          test "$failed" -eq 0
