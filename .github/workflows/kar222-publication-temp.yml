name: KAR-222 C D1 E focused
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-publication-temp.yml','tests/kar222-publication-identity-witness.cjs']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Scoped runtime diff and syntax
        run: |
          git diff --name-status e2065e0b395240aebe4e95abc0842c6cda4bcb7b HEAD
          git diff --exit-code e1b91784d2316241d71d2c7fac1aef8ecaa1fe20 HEAD -- manifest.json lib icons
          git diff --name-only e1b91784d2316241d71d2c7fac1aef8ecaa1fe20 HEAD -- src | while read -r f; do node --check "$f"; done
          node --check tests/kar222-publication-identity-witness.cjs
      - name: Prior GREEN and publication identity witnesses
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node --test --test-reporter=tap tests/kar199-phase4-ui-runtime.cjs tests/kar222-b16-recovery-ui.cjs tests/kar199-emergency-reset-candidate-recovery.cjs tests/kar222-b14-recovery.cjs tests/kar210-kar199-baseline-reset.cjs tests/kar222-delete-no-replay.cjs tests/kar199-phase4-no-transport-replay.cjs tests/kar210-kar199-baseline-phase4.cjs tests/kar210-cp36-phase4-product-witness.cjs tests/kar210-kar150-mass-baseline.cjs tests/kar210-kar150-uncertain-start-witness.cjs tests/kar222-mass-recovery-witness.cjs tests/kar210-cp38-publish-uncertainty-witness.cjs tests/kar210-cp36-phase4-unknown-witness.cjs tests/kar222-publication-identity-witness.cjs
