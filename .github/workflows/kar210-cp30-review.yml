name: KAR-210 CP30 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp30-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1220-browser-e2e-contract.cjs tests/v1221-actions-controlled-accordion.cjs tests/v1223-action-focus-modality.cjs tests/v1226-diagnostics-actions-runtime.cjs tests/v1227-pre-refactor-characterization.cjs tests/v1227-modularization.cjs tests/v12210-pre-refactor-characterization.cjs tests/v12211-modularization.cjs tests/v12221-modularization.cjs tests/v12224-message-contract-registry-runtime.cjs tests/v12225-message-contract-enforcement-runtime.cjs tests/v12228-pre-patch-characterization.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP30_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP30_PASS $f"; else echo "CP30_FAIL $f"; failed=1; fi
          done
          exit "$failed"

