name: KAR-222 W3 deterministic Work candidate (temporary)
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-tab-topology-temp.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deterministic candidate and exact archive evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/kar222-tab-topology-temp.yml
          git diff --name-status
          /usr/bin/time -f 'KAR222_TIME package1 %e s' python3 scripts/package.py "$RUNNER_TEMP/kar-a"
          /usr/bin/time -f 'KAR222_TIME package2 %e s' python3 scripts/package.py "$RUNNER_TEMP/kar-b"
          export CANDIDATE="$RUNNER_TEMP/kar-a/kleinanzeigen-renewal-chrome-v2.0.5.0.zip"
          cmp "$CANDIDATE" "$RUNNER_TEMP/kar-b/kleinanzeigen-renewal-chrome-v2.0.5.0.zip"
          cmp "$RUNNER_TEMP/kar-a/kleinanzeigen-renewal-source-v2.0.5.0.zip" "$RUNNER_TEMP/kar-b/kleinanzeigen-renewal-source-v2.0.5.0.zip"
          python3 - <<'PY'
          import base64, hashlib, json, os, sys, pathlib, zipfile
          sys.path.insert(0,'scripts')
          from verify_committed_chrome_zip import validate_bytes
          p=pathlib.Path(os.environ['CANDIDATE'])
          data=p.read_bytes()
          m=json.loads(pathlib.Path('manifest.json').read_text())
          info=validate_bytes(data,data,m,pathlib.Path('APP_ID.txt').read_text())
          assert m['version']=='2.0.5.0' and info['runtimeEntries']==122
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  assert z.read(n)==pathlib.Path(n).read_bytes(),n
              assert z.testzip() is None
              assert not any('native-update' in n or 'native-status' in n for n in z.namelist())
          encoded=base64.b64encode(data).decode()
          parts=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
          info.update({'blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'chunks':len(parts),'base64Length':len(encoded)})
          print('KAR222_ZIP_META '+json.dumps(info,separators=(',',':')))
          for i,chunk in enumerate(parts): print('KAR222_ZIP_CHUNK %04d %s'%(i,chunk))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kar222-work-candidate-2.0.5.0
          path: ${{ runner.temp }}/kar-a/kleinanzeigen-renewal-chrome-v2.0.5.0.zip
          retention-days: 14
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prospective sealed tree, unchanged mandatory coverage gate
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/kar222-tab-topology-temp.yml
          python3 scripts/package.py "$RUNNER_TEMP/kar-quality"
          ZIP=release/kleinanzeigen-renewal-chrome-v2.0.5.0.zip
          test ! -e "$ZIP"
          cp "$RUNNER_TEMP/kar-quality/kleinanzeigen-renewal-chrome-v2.0.5.0.zip" "$ZIP"
          python3 scripts/verify_committed_chrome_zip.py --base-sha 4d7ae5130730776927748e2517fdf9aadaf098cd
          /usr/bin/time -f 'KAR222_TIME full_coverage_gate %e s' bash scripts/coverage-gate.sh
      - name: Official syntax/core/packaging build
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'KAR222_TIME official_build %e s' bash scripts/build.sh "$RUNNER_TEMP/kar-official"
          cmp release/kleinanzeigen-renewal-chrome-v2.0.5.0.zip "$RUNNER_TEMP/kar-official/kleinanzeigen-renewal-chrome-v2.0.5.0.zip"
