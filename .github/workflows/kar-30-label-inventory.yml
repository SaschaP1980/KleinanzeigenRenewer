name: KAR-30 Public Label Inventory
on:
  pull_request:
    paths:
      - '.github/workflows/kar-30-label-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-label-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch complete public label definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repositories = [
              "SaschaP1980/RazerHealthCenter",
              "SaschaP1980/LenovoBootSelector",
              "SaschaP1980/KleinanzeigenRenewer",
          ]
          output = {}
          for repo in repositories:
              page = 1
              labels = []
              while True:
                  url = f"https://api.github.com/repos/{repo}/labels?per_page=100&page={page}"
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "KAR-30-label-inventory",
                  })
                  with urllib.request.urlopen(request, timeout=25) as response:
                      batch = json.load(response)
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Unexpected API payload for {repo}")
                  labels.extend({
                      "name": item["name"],
                      "color": item["color"],
                      "description": item.get("description"),
                  } for item in batch)
                  if len(batch) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise RuntimeError(f"Pagination limit exceeded for {repo}")
              output[repo] = sorted(labels, key=lambda item: item["name"].casefold())
              print(f"INVENTORY {repo}: {len(labels)} labels, {page} pages")
          text = json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True)
          with open("kar-30-label-inventory.json", "w", encoding="utf-8") as f:
              f.write(text + "\n")
          print("KAR30_LABEL_INVENTORY_JSON_BEGIN")
          print(json.dumps(output, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          print("KAR30_LABEL_INVENTORY_JSON_END")
          PY
      - name: Upload read-only inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: kar-30-public-label-inventory
          path: kar-30-label-inventory.json
          retention-days: 7
