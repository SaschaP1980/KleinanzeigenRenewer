name: KAR-171 temporary R1 authenticated identity proof
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
concurrency:
  group: kar171-native-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: R1 same-account remote provenance (synthetic, no real account)
        run: node tests/kar171-r1-native-account-proof.cjs
      - name: Full mandatory runtime and coverage safety
        run: |
          rm .github/workflows/kar171-r1-native-proof.yml
          bash scripts/coverage-gate.sh
