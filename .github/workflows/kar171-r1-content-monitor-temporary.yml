name: KAR-171 R1 independent monitor proof
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  monitor:
    if: contains(github.event.head_commit.message, 'KAR171-R1-MONITOR-')
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused test and immutable product guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git diff --name-only 87cc10675e2844e71abc2cf6d4a285d1974b7066 "$GITHUB_SHA" -- manifest.json src release scripts package-lock.json | grep -q .; then
            echo "Product runtime, owner ZIP or permissions mutated during monitor-only work" >&2
            exit 1
          fi
          node --test tests/kar171-r1-independent-content-pending-monitor.cjs
      - name: Complete registered regression, safety, coverage and architecture (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-MONITOR-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar171-r1-content-monitor-temporary.yml
          bash scripts/coverage-gate.sh
          git restore .github/workflows/kar171-r1-content-monitor-temporary.yml
          git diff --exit-code
      - name: Current v1.25.22 ZIP exact clean rebuild proof (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-MONITOR-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-monitor"
          python3 scripts/verify_committed_chrome_zip.py --report "$RUNNER_TEMP/kar171-monitor/parity.json"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('release/kleinanzeigen-renewal-chrome-v1.25.22.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f9d5608cea0a455822d6f918ecdc79321bda78681021ebccdd530ea48a703f19'
          print('PASS exactly unchanged source-built v1.25.22 Work-only ZIP')
          PY
      - name: Packaged offline Chromium 9/9 (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-MONITOR-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export KR_E2E_BROWSER_CHANNEL=chromium
          mkdir -p "$RUNNER_TEMP/kar171-monitor/unpacked"
          unzip -q release/kleinanzeigen-renewal-chrome-v1.25.22.zip -d "$RUNNER_TEMP/kar171-monitor/unpacked"
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar171-monitor/unpacked"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar171-monitor/e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-monitor'/'e2e.json').read_text())
          assert r['scenarioCount']==9 and r['passed']==9 and r['failed']==0 and r['cleanupFailed']==0,r
          print('PASS unmodified v1.25.22 packaged Chromium 9/9')
          PY
      - name: Preserve synthetic reports (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-MONITOR-GREEN')
        uses: actions/upload-artifact@v4
        with:
          name: kar171-r1-monitor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kar171-monitor/parity.json
            ${{ runner.temp }}/kar171-monitor/e2e.json
          retention-days: 30
          if-no-files-found: error

# Green run: independent observer source + registered full regression + existing ZIP parity.
