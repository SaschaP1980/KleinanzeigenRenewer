name: KAR-161 isolated packaged startup diagnosis
# Capture Chrome service worker and message router to distinguish UI vs runtime boot.
on:
  push:
    branches: [work/KAR-161]
    paths:
      - .github/workflows/kar161-startup-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --no-shell chromium
          echo "KR_CHROME_BINARY=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Read-only real browser startup check, no account
        shell: bash
        run: python3 tests/e2e/kar161-startup-smoke.py
