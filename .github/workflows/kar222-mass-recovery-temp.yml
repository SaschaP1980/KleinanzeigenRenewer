name: KAR-222 mass A B focused
on:
  push:
    branches: [work/KAR-222]
    paths: ['.github/workflows/kar222-mass-recovery-temp.yml','tests/kar222-mass-recovery-witness.cjs','src/background/controllers/mass-renewal-workflow-controller.js','src/background/controllers/mass-renewal-controller.js','src/app/mass-renewal-ui-controller.js']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Scope and syntax
        run: |
          git diff --name-status e865f627056a70b8a414da4c311365d1050faf49 HEAD
          node --check tests/kar222-mass-recovery-witness.cjs
          for p in $(git diff --name-only e865f627056a70b8a414da4c311365d1050faf49 HEAD -- src); do node --check "$p"; done
      - name: All focused regression and mass witnesses
        run: |
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          node --test --test-reporter=tap tests/kar199-phase4-ui-runtime.cjs tests/kar222-b16-recovery-ui.cjs tests/kar199-emergency-reset-candidate-recovery.cjs tests/kar222-b14-recovery.cjs tests/kar210-kar199-baseline-reset.cjs tests/kar222-delete-no-replay.cjs tests/kar199-phase4-no-transport-replay.cjs tests/kar210-kar199-baseline-phase4.cjs tests/kar210-cp36-phase4-product-witness.cjs tests/kar210-kar150-mass-baseline.cjs tests/kar210-kar150-uncertain-start-witness.cjs tests/kar222-mass-recovery-witness.cjs
      - name: Retained mass and workflow compatibility
        shell: bash
        run: |
          set +e
          export NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs'
          failures=0
          for p in tests/kar210-kar150-mass-baseline.cjs tests/v12013-mass-gold-line.cjs tests/v12014-mass-count-normalization.cjs tests/v12016-mass-status-normalization.cjs tests/v12019-retry-ui.cjs tests/v12021-mass-summary-bald-online.cjs tests/v12114-ui-copy-consistency.cjs tests/v12230-global-emergency-reset.cjs tests/v1231-renewal-workflow-modularization.cjs tests/v1231-renewal-workflow-runtime.cjs tests/v12315-runtime.cjs tests/v12320c1-stale-terminal-mass-resync.cjs tests/v1233-mass-renewal-workflow-modularization.cjs tests/v1233-mass-renewal-workflow-runtime.cjs tests/v1239-controllers-runtime.cjs; do
            echo "KAR222_BEGIN $p"
            node "$p"
            rc=$?
            echo "KAR222_END $p rc=$rc"
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "KAR222_NONZERO_COMMANDS=$failures"
          test "$failures" -eq 0
