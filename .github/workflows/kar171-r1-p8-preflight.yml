name: KAR-171 R1 P8 read-only preflight (temporary)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: read
jobs:
  r1_p8_preflight:
    name: R1 original P8 preflight security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused private and read-only P8 preflight
        run: node tests/kar171-r1-p8-readonly-preflight.cjs
      - name: Remove disposable workflow before full coverage
        run: rm .github/workflows/kar171-r1-p8-preflight.yml
      - name: Full regression, public API, architecture and safety gates
        run: bash scripts/coverage-gate.sh
