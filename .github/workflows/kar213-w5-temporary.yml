name: KAR-213 W5 successor diagnostic (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-w5-temporary.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact test-first RED
        run: |
          set -euo pipefail
          set +e
          node tests/kar213-successor-contract.cjs > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" = 1
          grep -q 'S03 exact successor not yet admitted' /tmp/red.log
      - name: Enumerate actual version-dependent contracts
        run: |
          git grep -n -F '2.0.1.0' -- tests scripts .github/workflows ':!tests/fixtures/*' ':!tests/kar213-successor-contract.cjs' ':!.github/workflows/kar213-w5-temporary.yml' | cut -c1-360 || true
          git diff --name-status 61f917d384cdce0fc191188e5a99515907967dbe HEAD
