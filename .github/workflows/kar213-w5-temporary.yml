name: KAR-213 W5 full gates (temporary)
on:
  push:
    branches: [work/KAR-213]
    paths: ['.github/workflows/kar213-w5-temporary.yml']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 02b7969dfa50e2953701d1a29d075b4641f53d2a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact lineage and source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "02b7969dfa50e2953701d1a29d075b4641f53d2a"
          node tests/kar213-successor-contract.cjs
          python3 tests/kar210-baseline-restore.py
          node tests/kar210-test-disposition.cjs
      - run: npm ci
      - name: Mandatory coverage and architecture gate
        run: bash scripts/coverage-gate.sh
      - name: Reproducible candidate package
        run: |
          set -euo pipefail
          V="$(python3 scripts/product_version.py)"
          test "$V" = 2.0.2.0
          python3 scripts/package.py "$RUNNER_TEMP/build-a"
          python3 scripts/package.py "$RUNNER_TEMP/build-b"
          ZIP="kleinanzeigen-renewal-chrome-v$V.zip"
          cmp "$RUNNER_TEMP/build-a/$ZIP" "$RUNNER_TEMP/build-b/$ZIP"
          unzip -t "$RUNNER_TEMP/build-a/$ZIP" >/dev/null
          sha256sum "$RUNNER_TEMP/build-a/$ZIP"
          wc -c "$RUNNER_TEMP/build-a/$ZIP"
          unzip -Z -1 "$RUNNER_TEMP/build-a/$ZIP" | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: kar213-candidate-02b7969dfa50e2953701d1a29d075b4641f53d2a
          path: ${{ runner.temp }}/build-a/kleinanzeigen-renewal-chrome-v2.0.2.0.zip
          if-no-files-found: error
  tail-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 02b7969dfa50e2953701d1a29d075b4641f53d2a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Independent remaining commands diagnostic (not mandatory gate credit)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "02b7969dfa50e2953701d1a29d075b4641f53d2a"
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          cmds=json.loads(Path('package.json').read_text())['scripts']['test'].split(' && ')
          start=cmds.index('node tests/v1235-pre-refactor-characterization.cjs')
          end=cmds.index('node scripts/v12319-coverage-report.cjs coverage/raw coverage')
          env={**os.environ,'NODE_OPTIONS':'--require ./tests/v12222-vm-legacy-bridge.cjs'}
          failed=[]
          for cmd in cmds[start:end]:
              p=subprocess.run(cmd.split(),env=env,capture_output=True,text=True,timeout=30)
              print('TAIL_DIAGNOSTIC',p.returncode,cmd,flush=True)
              if p.returncode:
                  failed.append(cmd)
                  print((p.stdout+p.stderr)[-2500:],flush=True)
          print('TAIL_DIAGNOSTIC_SUMMARY',len(cmds[start:end]),len(failed),failed)
          raise SystemExit(bool(failed))
          PY
