name: KAR-210 CP26 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp26-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1170-a1b-authority.cjs tests/v1171-phase-retries.cjs tests/v1171-phase-retry-policy-runtime.cjs tests/v1172-account-modal-ux.cjs tests/v1173-profile-status-ux.cjs tests/v1174-sidebar-header-ux.cjs tests/v1176-guided-trash-template.cjs tests/v1176-trash-template-publish-runtime.cjs tests/v1178-phase3-public-url.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP26_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP26_PASS $f"; else echo "CP26_FAIL $f"; failed=1; fi
          done
          exit "$failed"
