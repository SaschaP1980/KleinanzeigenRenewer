name: KAR-210 CP28 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp28-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1202-a7-indexeddb.cjs tests/v1203-hot-path.cjs tests/v1203-hot-path-runtime.cjs tests/v12013-phase3-public-verification.cjs tests/v12016-phase3-public-readiness.cjs tests/v12018-activity-history-bootstrap.cjs tests/v12019-bald-online.cjs tests/kar210-startup-isolation-witness.cjs tests/kar210-loading-retention-baseline.cjs tests/kar210-kar175-public-navigation-baseline.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP28_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP28_PASS $f"; else echo "CP28_FAIL $f"; failed=1; fi
          done
          exit "$failed"
