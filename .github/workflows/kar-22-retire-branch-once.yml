name: KAR-22 Retire Verified KAR-19 Branch Once

on:
  workflow_run:
    workflows: [KAR CI]
    types: [completed]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  retire:
    name: Delete exactly merged work/KAR-19 (one-time)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Prove merge, issue closure, current GREEN main, unchanged ref and no open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SaschaP1980/KleinanzeigenRenewer"
          EXPECTED_OLD_HEAD=9105393b37382ec148fc470adeeec0b002a1efd7
          MAIN_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$MAIN_HEAD" = "$CI_SHA" || {
            echo "Main moved after the triggering successful CI; fail closed" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/pulls/20" > /tmp/kar-pr-20.json
          jq -e --arg expected "$EXPECTED_OLD_HEAD" \
            '.state == "closed" and .merged_at != null and .head.ref == "work/KAR-19" and .head.sha == $expected and .base.ref == "main"' /tmp/kar-pr-20.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/issues/19" > /tmp/kar-issue-19.json
          jq -e '.state == "closed"' /tmp/kar-issue-19.json >/dev/null
          LIVE_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/work/KAR-19" --jq '.object.sha')"
          test "$LIVE_HEAD" = "$EXPECTED_OLD_HEAD" || {
            echo "Unexpected branch movement; refusing deletion" >&2
            exit 1
          }
          OPEN_MATCHES="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq '[.[][] | select(.head.ref == "work/KAR-19" and .head.repo.full_name == "SaschaP1980/KleinanzeigenRenewer")] | length')"
          test "$OPEN_MATCHES" = 0 || {
            echo "An open PR still uses the Work branch; refusing deletion" >&2
            exit 1
          }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/work/KAR-19"
          set +e
          RESPONSE="$(gh api --include "repos/$GITHUB_REPOSITORY/git/ref/heads/work/KAR-19" 2>&1)"
          RC=$?
          set -e
          test "$RC" -ne 0 && grep -Eq 'HTTP/[0-9.]+ 404' <<< "$RESPONSE" || {
            echo "Branch deletion not independently verified as HTTP 404" >&2
            exit 1
          }
          echo "PASS exact work/KAR-19 ref deleted, readback HTTP 404; all prerequisites checked."
