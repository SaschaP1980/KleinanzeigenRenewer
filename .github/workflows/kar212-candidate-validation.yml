name: KAR-212 hotfix candidate validation
on:
  push:
    branches: [work/KAR-212]
    paths: ['.github/workflows/kar212-candidate-validation.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2fe1d81d8823a4ab47ba0fccee1b65b0e073b37f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact clean source and full gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2fe1d81d8823a4ab47ba0fccee1b65b0e073b37f'
          test -z "$(git status --porcelain)"
          test "$(python3 scripts/product_version.py)" = 2.0.0.1
          echo 'cc9ec37d0e9bf3c7688438ad04e9df0983a71d54b0802833906d8580d5902839  release/kleinanzeigen-renewal-chrome-v2.0.0.0.zip' | sha256sum -c
          npm ci
          python3 scripts/package.py "$RUNNER_TEMP/hotfix1"
          cp "$RUNNER_TEMP/hotfix1/kleinanzeigen-renewal-chrome-v2.0.0.1.zip" release/
          git grep -nE 'bbdeee5b2c6125545b22de209c4d52fd1bdeb9ad|SOURCE_RESTORED_GATES_PENDING' -- tests scripts | cut -c1-400 || true
          git grep -nF '2.0.0.0' -- tests scripts | cut -c1-350 || true
          if ! bash scripts/coverage-gate.sh; then
            echo 'FULL_GATE_FAILED; characterize each remaining active command without claiming acceptance'
            python3 - <<'PY'
          import json,subprocess,os
          cmds=json.load(open('package.json'))['scripts']['test'].split(' && ')
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs')
          start=next(i for i,c in enumerate(cmds) if 'v12317c1-template-module-public-api.cjs' in c)
          for c in cmds[start:]:
              try:
                  p=subprocess.run(c,shell=True,env=env,capture_output=True,text=True,timeout=60)
                  if p.returncode:
                      print('KAR212_DIAGNOSTIC_RED',c,p.returncode,flush=True)
                      print((p.stdout+'\n'+p.stderr)[-2200:],flush=True)
              except subprocess.TimeoutExpired: print('KAR212_DIAGNOSTIC_TIMEOUT',c,flush=True)
          PY
            exit 1
          fi
          python3 scripts/package.py "$RUNNER_TEMP/hotfix2"
          cmp "$RUNNER_TEMP/hotfix1/kleinanzeigen-renewal-chrome-v2.0.0.1.zip" "$RUNNER_TEMP/hotfix2/kleinanzeigen-renewal-chrome-v2.0.0.1.zip"
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          a=pathlib.Path('release/kleinanzeigen-renewal-chrome-v2.0.0.0.zip')
          p=pathlib.Path('release/kleinanzeigen-renewal-chrome-v2.0.0.1.zip')
          with zipfile.ZipFile(a) as z0,zipfile.ZipFile(p) as z1:
              assert z1.testzip() is None
              assert len(z1.namelist())==124 and len(set(z1.namelist()))==124
              assert set(z0.namelist())==set(z1.namelist())
              diff=sorted(n for n in z0.namelist() if z0.read(n)!=z1.read(n))
              assert diff==['CHANGELOG.md','manifest.json','src/background/background.js'],diff
              m0=json.loads(z0.read('manifest.json'));m1=json.loads(z1.read('manifest.json'))
              assert m1.pop('version')=='2.0.0.1' and m0.pop('version')=='2.0.0.0' and m1==m0
              print('CP42_HOTFIX_PACKAGE '+json.dumps(dict(bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),blob=hashlib.sha1(b'blob '+str(p.stat().st_size).encode()+b'\0'+p.read_bytes()).hexdigest(),members=124,changedMembers=diff)))
          PY
          python3 - <<'PY'
          import pathlib,base64
          p=pathlib.Path('release/kleinanzeigen-renewal-chrome-v2.0.0.1.zip')
          s=base64.b64encode(p.read_bytes()).decode()
          for n,i in enumerate(range(0,len(s),4096)): print(f'KAR212_BINARY {n:04d} {s[i:i+4096]}',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kar212-hotfix-candidate
          path: |
            release/kleinanzeigen-renewal-chrome-v2.0.0.1.zip
            coverage/public-api-coverage.json
            coverage/line-coverage.json
            coverage/branch-coverage.json
            coverage/architecture-audit.json
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2fe1d81d8823a4ab47ba0fccee1b65b0e073b37f
          fetch-depth: 0
          persist-credentials: false
      - name: Exact independent package and real browser fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2fe1d81d8823a4ab47ba0fccee1b65b0e073b37f'
          test -z "$(git status --porcelain)"
          python3 scripts/package.py "$RUNNER_TEMP/hotfix"
          cp "$RUNNER_TEMP/hotfix/kleinanzeigen-renewal-chrome-v2.0.0.1.zip" release/
          ZIP="$PWD/release/kleinanzeigen-renewal-chrome-v2.0.0.1.zip"
          sha256sum "$ZIP"
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$KR_CHROME_BINARY"
          export KR_E2E_BROWSER_CHANNEL=chromium
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/extension"
          mkdir -p "$KR_E2E_EXTENSION_ROOT"
          unzip -q "$ZIP" -d "$KR_E2E_EXTENSION_ROOT"
          python3 tests/e2e/kar161-startup-smoke.py
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/browser-e2e-report.json"
          python3 tests/e2e/verify_pr_e2e_report.py --report "$RUNNER_TEMP/browser-e2e-report.json" --zip "$ZIP" --expected-head '2fe1d81d8823a4ab47ba0fccee1b65b0e073b37f' --out "$RUNNER_TEMP/e2e-attestation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kar212-browser-evidence
          path: |
            ${{ runner.temp }}/browser-e2e-report.json
            ${{ runner.temp }}/e2e-attestation.json
          if-no-files-found: warn
