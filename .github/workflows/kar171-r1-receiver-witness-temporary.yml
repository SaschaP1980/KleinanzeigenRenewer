name: KAR-171 R1 independent receiver witness validation
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  receiver-witness:
    if: contains(github.event.head_commit.message, 'KAR171-R1-RECEIVER-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact fixture source and independent-ACK safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tests/e2e/kar171_r1_inflight_mv3_probe.py
          if git diff --name-only f0e0cc2209aec63c4b721840a2a14216b00e9ad5 "$GITHUB_SHA" -- manifest.json src package.json package-lock.json release scripts tools/windows | grep -q .; then
            echo 'Unauthorized packaged runtime, permissions, ZIP or release drift' >&2
            exit 1
          fi
          node --test tests/kar171-r1-native-inflight-fixture-contract.cjs
      - name: Full coverage and architecture gate (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-RECEIVER-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar171-r1-receiver-witness-temporary.yml
          bash scripts/coverage-gate.sh
      - name: Real disposable Chromium independent ACK and MV3 interruptions (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-RECEIVER-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=playwright=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export KR_E2E_BROWSER_CHANNEL=chromium
          mkdir -p "$RUNNER_TEMP/kar171-receiver"
          python3 tests/e2e/kar171_r1_inflight_mv3_probe.py --report "$RUNNER_TEMP/kar171-receiver/report.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-receiver'/'report.json').read_text())
          assert r['status']=='PASS', r
          assert r['isolatedSyntheticFixture'] is True and r['ownerNativeScan'] is False
          assert r['r1Accepted'] is False and r['eligibleForLease'] is False
          assert len(r['checks'])==12,r
          assert 'independent_receiver_ack_source_and_target' in r['checks']
          assert 'genuine_mv3_termination_and_new_worker_generation' in r['checks']
          assert 'second_mv3_termination_during_target_query' in r['checks']
          assert r['workerGenerationChanged'] is True
          print('PASS independent synthetic receiver ACK + both real MV3 worker terminations')
          PY
          echo "KR_CHROME_BINARY=$KR_CHROME_BINARY" >> "$GITHUB_ENV"
          echo "KR_E2E_BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"
      - name: Archived owner ZIP exact parity and default packaged Chromium E2E 9/9 (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-RECEIVER-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-receiver/package" "$RUNNER_TEMP/kar171-receiver/unpacked"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-receiver/package"
          ZIP="$RUNNER_TEMP/kar171-receiver/package/kleinanzeigen-renewal-chrome-v1.25.21.zip"
          cmp "$ZIP" release/kleinanzeigen-renewal-chrome-v1.25.21.zip
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "c6aa24e84c167b741718e58f27b048cd2d2b20c9dca48983c9ce60482e883693"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kar171-receiver/unpacked"
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar171-receiver/unpacked"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar171-receiver/default-e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-receiver'/'default-e2e.json').read_text())
          assert r['scenarioCount']==9 and r['passed']==9
          assert r['failed']==0 and r['cleanupFailed']==0,r
          print('PASS default 9/9 unchanged packaged Chromium')
          PY
      - name: Upload synthetic-only reports (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-RECEIVER-GREEN')
        uses: actions/upload-artifact@v4
        with:
          name: kar171-r1-receiver-witness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kar171-receiver/report.json
            ${{ runner.temp }}/kar171-receiver/default-e2e.json
          retention-days: 30
          if-no-files-found: error

# Disposal required after confirmed completed GREEN; not a production workflow.
