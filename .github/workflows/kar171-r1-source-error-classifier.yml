name: KAR-171 R1 source query failure read-only diagnostic
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
concurrency:
  group: kar171-r1-source-error-classifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Synthetic privacy, failure reason and read-only message contract
        run: node tests/kar171-r1-source-query-classifier.cjs
      - name: Complete source safety and architecture validation
        run: |
          rm .github/workflows/kar171-r1-source-error-classifier.yml
          bash scripts/coverage-gate.sh
