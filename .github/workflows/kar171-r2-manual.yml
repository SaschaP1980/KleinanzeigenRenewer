name: KAR-171 R2 manual transaction identity (temporary)
on:
  push:
    branches: [work/KAR-171]
    paths:
      - tools/windows/KleinanzeigenRenewer-Updater.ps1
      - tests/windows-updater-phase1.ps1
      - tests/windows-native-host-wave1.ps1
      - tests/kar68-native-status-gateway.cjs
      - tests/kar99-p13-native-transaction-closure.cjs
      - src/background/services/additional-owner-observer.js
      - src/background/services/native-update-status-gateway.js
      - tools/windows/KleinanzeigenRenewer.NativeHost.cs
      - .github/workflows/kar171-r2-manual.yml
permissions:
  contents: read
jobs:
  native-manual:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      KAR_UPDATER_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Windows offline transaction and interrupted recovery proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows-updater-phase1.ps1

  windows-native-oracle:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      KAR_UPDATER_TEST_MODE: '1'
      KAR_NATIVE_HOST_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: NativeHost authentic Windows manual transaction inspection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\windows-native-host-wave1.ps1

  node-native-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Strict NativeHost manual transaction parsing in private extension gateway
        run: node tests/kar68-native-status-gateway.cjs

  node-native-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate private 15-owner NativeHost-only negative source
        run: node --test tests/kar99-p13-native-transaction-closure.cjs
