name: KAR-214 focused trash characterization
on:
  push:
    branches: ['work/KAR-214']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Execute all five focused suites without stopping at first RED
        shell: bash
        run: |
          set +e
          rc=0
          for test in tests/kar214-retention-startup.cjs tests/kar161-trash-retention.cjs tests/kar164-trash-sort.cjs tests/kar165-trash-retention-warning.cjs tests/kar186-retention-hydration.cjs; do
            echo "BEGIN $test"
            node "$test"
            code=$?
            echo "RESULT $test RC=$code"
            if [ "$code" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
