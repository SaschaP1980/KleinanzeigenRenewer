name: KAR-164 one-shot local minor ZIP builder (temporary)
on:
  push:
    branches: [work/KAR-164]
permissions:
  contents: write
jobs:
  package:
    if: github.event.head_commit.message == 'ci-KAR164-package-v1.25.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fail-closed exact branch, marker and source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/KAR-164
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git log -1 --format=%s)" = ci-KAR164-package-v1.25.0
          test -z "$(git diff-tree --no-commit-id --name-only -r HEAD)"
          git merge-base --is-ancestor 98277fca667efe0d55421351f8896b4176302dd5 HEAD^
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 2a07edda7520f2b57e422236c957853d68697f0a
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" = 1.25.0
          test "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" = 1.25.0
          test "$(python3 -c 'import json; print(json.load(open("release/release-spec.json"))["version"])')" = 1.25.0
          test ! -e release/kleinanzeigen-renewal-chrome-v1.25.0.zip
      - name: Show exact historical version-gate references (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          rg -n 'includesActivePatch\(|isFeature24|approvedMinorFeature|manifest\.version === .1\.24\.0' tests -g '*.cjs' -g '*.mjs' | head -180 || true
      - name: Rebuild and verify the Chrome-only ZIP without release or remote actions
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/kleinanzeigen-renewal-chrome-v1.25.0.zip
          python3 scripts/package.py "$RUNNER_TEMP/kar164-build"
          cp "$RUNNER_TEMP/kar164-build/kleinanzeigen-renewal-chrome-v1.25.0.zip" "$ZIP"
          python3 scripts/verify_committed_chrome_zip.py --base-sha 2a07edda7520f2b57e422236c957853d68697f0a
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP"
          git add -f "$ZIP"
          test "$(git diff --cached --name-only)" = "$ZIP"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(KAR-164): reproducible v1.25.0 Chrome ZIP only'
          git push origin HEAD:refs/heads/work/KAR-164
  audit:
    if: github.event.head_commit.message == 'ci-KAR164-audit-version-guards'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Locate current-minor historical test guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/KAR-164
          test -z "$(git diff-tree --no-commit-id --name-only -r HEAD)"
          echo 'BEGIN_KAR164_VERSION_GUARDS'
          python3 -c 'from pathlib import Path; files = sorted(p for p in Path("tests").rglob("*") if p.suffix in (".cjs", ".mjs")); [(print(f"{p}:{i}:{s.strip()[:230]}")) for p in files for i, s in enumerate(p.read_text(encoding="utf-8").splitlines(), 1) if ("manifest.version" in s or "spec.version" in s or "featureSeries24" in s) and ("24" in s or "25" in s or "feature" in s)]' | head -150 || true
          echo 'END_KAR164_VERSION_GUARDS'
