name: KAR-171 R1 private production content-side witness Work validation
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  private-witness:
    if: contains(github.event.head_commit.message, 'KAR171-R1-PROD-WITNESS-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and focused private content witness contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/kar171-r1-production-content-witness.cjs
      - name: Full regression and coverage gate (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-PROD-WITNESS-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar171-r1-production-private-witness-temporary.yml
          bash scripts/coverage-gate.sh
      - name: Source-only exact runtime ZIP delta and default browser 9/9 (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-PROD-WITNESS-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kar171-prod/pack" "$RUNNER_TEMP/kar171-prod/unpacked"
          python3 scripts/package.py "$RUNNER_TEMP/kar171-prod/pack"
          ZIP="$RUNNER_TEMP/kar171-prod/pack/kleinanzeigen-renewal-chrome-v1.25.21.zip"
          unzip -t "$ZIP" >/dev/null
          if cmp -s "$ZIP" release/kleinanzeigen-renewal-chrome-v1.25.21.zip; then
            echo 'Unexpected archived ZIP parity: new Work-only runtime should not pretend owner-installed ZIP was upgraded' >&2
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps --no-shell chromium
          export KR_CHROME_BINARY="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export KR_E2E_BROWSER_CHANNEL=chromium
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kar171-prod/unpacked"
          export KR_E2E_EXTENSION_ROOT="$RUNNER_TEMP/kar171-prod/unpacked"
          python3 tests/e2e/run_browser_e2e_supervisor.py --report "$RUNNER_TEMP/kar171-prod/e2e.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'kar171-prod'/'e2e.json').read_text())
          assert r['scenarioCount']==9 and r['passed']==9 and r['failed']==0 and r['cleanupFailed']==0,r
          print('PASS new Work source 9/9; archived v1.25.21 owner ZIP unchanged (NOT source/ZIP parity)')
          PY
      - name: Preserve synthetic-only browser report (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR171-R1-PROD-WITNESS-GREEN')
        uses: actions/upload-artifact@v4
        with:
          name: kar171-r1-production-private-witness-source-only-${{ github.sha }}
          path: ${{ runner.temp }}/kar171-prod/e2e.json
          retention-days: 30
          if-no-files-found: error

# Single-use Work-only source-validation workflow; remove after success.

# Correction: retain legacy normal path literal for v1.8.10 source contract.
