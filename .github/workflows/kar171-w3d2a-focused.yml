name: KAR-171 W3D2A owner revision witness (temporary)

on:
  push:
    branches: [work/KAR-171]

permissions:
  contents: read

jobs:
  focused:
    name: W3D2A independent P8 source revision RED-GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused 15-owner source witness regression
        run: node tests/kar99-p7-integrated-owner-authority.cjs
      - name: Install complete test dependencies
        run: npm ci
      - name: Full clean-tree regression, architecture, and V8 coverage gate
        shell: bash
        run: |
          set -euo pipefail
          # The temporary focused runner is removed from the checkout to
          # test the exact final production workflow inventory.
          rm .github/workflows/kar171-w3d2a-focused.yml
          bash scripts/coverage-gate.sh
