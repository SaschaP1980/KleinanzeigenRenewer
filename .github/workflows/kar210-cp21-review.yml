name: KAR-210 CP21 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp21-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1811-contract.cjs tests/v190-contract.cjs tests/v1100-contract.cjs tests/v1101-contract.cjs tests/v1102-contract.cjs tests/v1103-contract.cjs tests/v1104-contract.cjs tests/v1110-contract.cjs tests/v1111-contract.cjs tests/v1112-contract.cjs tests/v1113-contract.cjs tests/v1114-contract.cjs tests/v1115-contract.cjs tests/kar210-kar175-public-navigation-baseline.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP21_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP21_PASS $f"; else echo "CP21_FAIL $f"; failed=1; fi
          done
          exit "$failed"
