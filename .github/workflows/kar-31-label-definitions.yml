name: KAR-31 Label Definitions
on:
  pull_request:
    paths:
      - '.github/workflows/kar-31-label-definitions.yml'
permissions:
  contents: read
  issues: write
jobs:
  create-verified-labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create only approved missing labels and verify exact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          base=f"https://api.github.com/repos/{repo}/labels"
          desired=[
            {"name":"dev-ops","color":"c4907e","description":"Development Operations or CI/CD related"},
            {"name":"dev-path: work-branch","color":"8250DF","description":"Uses work/KAR-<issue> for Issue-backed changes through PR and required CI."},
            {"name":"priority: critical","color":"b60205","description":"Requires immediate attention / blocks important functionality"},
            {"name":"priority: high","color":"FFA500","description":"High priority; should be addressed soon"},
            {"name":"priority: low","color":"c5def5","description":"Low priority; can be addressed later"},
            {"name":"priority: medium","color":"fbca04","description":"Normal priority"},
          ]
          def request(url,method="GET",payload=None):
            headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","User-Agent":"KAR-31-label-definitions"}
            data=None if payload is None else json.dumps(payload).encode()
            if data is not None: headers["Content-Type"]="application/json"
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers,data=data,method=method),timeout=30) as response:
              return json.load(response)
          def inventory():
            rows=[];page=1
            while True:
              batch=request(base+f"?per_page=100&page={page}")
              if not isinstance(batch,list):raise RuntimeError("Unexpected labels response")
              rows.extend(batch)
              if len(batch)<100:break
              page+=1
              if page>100:raise RuntimeError("Pagination bound exceeded")
            return {item["name"]:item for item in rows}
          before=inventory()
          for item in desired:
            existing=before.get(item["name"])
            if existing is not None and (existing["color"].lower()!=item["color"].lower() or existing.get("description")!=item["description"]):
              raise RuntimeError("FAIL CLOSED: existing label differs: "+item["name"])
          for item in desired:
            if item["name"] not in before:
              created=request(base,"POST",item)
              if created["name"]!=item["name"]:raise RuntimeError("Create readback mismatch")
              print("CREATED "+item["name"])
            else:print("UNCHANGED "+item["name"])
          after=inventory()
          for item in desired:
            found=after.get(item["name"])
            if not found or found["color"].lower()!=item["color"].lower() or found.get("description")!=item["description"]:
              raise RuntimeError("VERIFY FAILED "+item["name"])
          if "dev-path: fast" in after:raise RuntimeError("Excluded fast-path label unexpectedly present")
          if set(before)-set(after):raise RuntimeError("Pre-existing label deleted")
          print("KAR31_VERIFIED_JSON_BEGIN")
          print(json.dumps({"before":len(before),"after":len(after),"labels":desired},sort_keys=True))
          print("KAR31_VERIFIED_JSON_END")
          PY
