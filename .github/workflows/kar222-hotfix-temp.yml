name: KAR-222 hotfix successor audit (temporary)
on:
  push:
    branches: [work/KAR-222]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory remaining exact-version references
        run: |
          git grep -n -F '2.0.5.0' -- scripts tests .github/workflows | cut -c1-400 || true
      - name: Audit prospective clean source and build
        run: |
          set -euo pipefail
          test "$(python3 scripts/product_version.py)" = 2.0.5.1
          npm ci
          rm .github/workflows/kar222-hotfix-temp.yml
          python3 tests/kar210-baseline-restore.py
          node tests/kar222-successor-contract.cjs
          node tests/kar210-baseline-version-contract.cjs
          node tests/kar222-delete-no-replay.cjs
          python3 scripts/package.py "$RUNNER_TEMP/kar-hotfix-a"
          python3 scripts/package.py "$RUNNER_TEMP/kar-hotfix-b"
          ZIP=kleinanzeigen-renewal-chrome-v2.0.5.1.zip
          cmp "$RUNNER_TEMP/kar-hotfix-a/$ZIP" "$RUNNER_TEMP/kar-hotfix-b/$ZIP"
          test ! -e "release/$ZIP"
          cp "$RUNNER_TEMP/kar-hotfix-a/$ZIP" "release/$ZIP"
          sha256sum "release/$ZIP"
          time bash scripts/coverage-gate.sh
          time bash scripts/build.sh "$RUNNER_TEMP/kar-hotfix-official"
          cmp "release/$ZIP" "$RUNNER_TEMP/kar-hotfix-official/$ZIP"
      - name: Preserve prospective candidate bytes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kar222-hotfix-prospective
          path: release/kleinanzeigen-renewal-chrome-v2.0.5.1.zip
          if-no-files-found: error
  transfer:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kar222-hotfix-prospective
          path: candidate
      - name: Attest and expose exact tested ZIP bytes for a leased Work commit
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          p=Path('candidate/kleinanzeigen-renewal-chrome-v2.0.5.1.zip')
          data=p.read_bytes()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              assert json.loads(z.read('manifest.json'))['version']=='2.0.5.1'
              assert len(z.namelist())==122
          encoded=base64.b64encode(data).decode('ascii')
          chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
          print('KAR222_ZIP_ATTEST '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'chunks':len(chunks)}))
          for i,chunk in enumerate(chunks):
              print('KAR222_ZIP_CHUNK_%04d %s' % (i,chunk))
          PY
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent command characterization (not mandatory gate acceptance)
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar222-hotfix-temp.yml
          python3 scripts/package.py "$RUNNER_TEMP/kar-hotfix-diagnostic"
          cp "$RUNNER_TEMP/kar-hotfix-diagnostic/kleinanzeigen-renewal-chrome-v2.0.5.1.zip" release/
          node scripts/runtime-api-inventory.cjs --json > coverage/public-api-manifest.json
          python3 - <<'PY'
          import json, os, subprocess, time
          commands=json.load(open('package.json'))['scripts']['test'].split(' && ')
          env=dict(os.environ,NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs')
          failed=[]
          start=time.monotonic()
          for index,command in enumerate(commands):
              try:
                  result=subprocess.run(command,shell=True,executable='/bin/bash',env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=90)
                  if result.returncode:
                      failed.append((index,command,result.returncode))
                      print('KAR222_COMMAND_FAILURE',index,command,result.returncode,flush=True)
                      print('\n'.join(result.stdout.splitlines()[-25:]),flush=True)
              except subprocess.TimeoutExpired:
                  failed.append((index,command,'timeout'))
                  print('KAR222_COMMAND_TIMEOUT',index,command,flush=True)
          print('KAR222_COMMAND_AUDIT',json.dumps({'total':len(commands),'pass':len(commands)-len(failed),'fail':failed,'seconds':round(time.monotonic()-start,3)}),flush=True)
          if failed: raise SystemExit(1)
          PY
