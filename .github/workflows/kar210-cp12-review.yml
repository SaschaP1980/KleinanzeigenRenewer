name: KAR-210 CP12 focused loading retention diagnostics
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp12-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/kar210-loading-retention-baseline.cjs tests/kar210-diagnostics-baseline.cjs tests/kar210-diagnostic-zip-integrity.cjs
      - run: node tests/kar210-test-disposition-contract.cjs
      - run: NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node tests/v1200-diagnostic-reset.cjs
      - run: NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node tests/v1237-diagnostic-export-runtime.cjs
  reset-unknown-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar210-diagnostic-reset-unknown.cjs

# Historical trash service is registered through KRDeps, not CommonJS.
