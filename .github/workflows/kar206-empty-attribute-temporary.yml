name: KAR-206 empty archive attribute status hotfix
on:
  push:
    branches: [work/KAR-206]
permissions:
  contents: read
jobs:
  empty-attribute:
    if: contains(github.event.head_commit.message, 'KAR206-EMPTY-')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source RED-GREEN original ZIP-to-form attribute status reproduction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/kar206-empty-archive-attribute-handoff.cjs
      - name: Full regression and coverage (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR206-EMPTY-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm .github/workflows/kar206-empty-attribute-temporary.yml
          bash scripts/coverage-gate.sh
          git restore .github/workflows/kar206-empty-attribute-temporary.yml
          git diff --exit-code
      - name: Source checks and unmodified upstream v1.25.23 ZIP parity (GREEN only)
        if: contains(github.event.head_commit.message, 'KAR206-EMPTY-GREEN')
        shell: bash
        run: |
          set -euo pipefail
          node --check src/background/services/template-fill-service.js
          node --check src/content/template-schema-preflight.js
          python3 scripts/verify_committed_chrome_zip.py --report "$RUNNER_TEMP/kar206-original-parity.json"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('release/kleinanzeigen-renewal-chrome-v1.25.23.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8b989d1c5d80a5b9358a56e42a5e95e3b1452fe57d4de00c87b924863f7a5b95'
          print('PASS immutable upstream Work v1.25.23 archive')
          PY
