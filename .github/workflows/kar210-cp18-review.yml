name: KAR-210 CP18 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp18-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/validate.mjs tests/v015-contract.cjs tests/v016-contract.cjs tests/v017-contract.cjs tests/current-patch-policy-regression.cjs tests/v110-contract.cjs tests/v111-contract.cjs tests/v112-contract.cjs tests/v113-contract.cjs tests/v114-contract.cjs tests/v115-contract.cjs tests/v116-contract.cjs tests/kar210-baseline-version-contract.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP18_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP18_PASS $f"; else echo "CP18_FAIL $f"; failed=1; fi
          done
          exit "$failed"
