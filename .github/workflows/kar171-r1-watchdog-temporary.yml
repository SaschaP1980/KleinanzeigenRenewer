name: KAR-171 R1 watchdog keepalive RED/GREEN validation
on:
  push:
    branches: [work/KAR-171]
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/kar171-r1-mv3-watchdog-idle.cjs
