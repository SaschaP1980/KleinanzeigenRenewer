name: KAR-210 candidate reset baseline review
on:
  push:
    branches: [work/KAR-210]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/kar210-kar199-baseline-reset.cjs
      - run: node tests/kar210-test-disposition-contract.cjs
      - run: node tests/v12230-global-emergency-reset.cjs
