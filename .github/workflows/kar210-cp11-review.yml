name: KAR-210 CP11 product boundary review
on:
  push:
    branches: [work/KAR-210]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --require ./tests/v12222-vm-legacy-bridge.cjs
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/kar210-kar199-baseline-reset.cjs tests/kar210-kar199-baseline-phase4.cjs tests/kar210-kar197-baseline-safety.cjs
      - run: node tests/kar210-test-disposition-contract.cjs
      - run: node tests/v12230-global-emergency-reset.cjs
      - run: node tests/v1234-insertion-lock-runtime.cjs
      - run: node tests/v12315-runtime.cjs
  no-replay-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/kar199-phase4-no-transport-replay.cjs
