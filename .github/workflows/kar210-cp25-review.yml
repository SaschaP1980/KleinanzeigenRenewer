name: KAR-210 CP25 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp25-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1160-inventory-capture-modal.cjs tests/v1161-single-inventory-edit-worker.cjs tests/v1161-single-inventory-edit-worker-runtime.cjs tests/v1163-single-inventory-result.cjs tests/v1164-gallery-root-img.cjs tests/v1165-inventory-microcopy.cjs tests/v1167-inventory-capture-reentry.cjs tests/v1168-single-reentry-direct-action.cjs tests/v1169-modal-discard-ux.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP25_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP25_PASS $f"; else echo "CP25_FAIL $f"; failed=1; fi
          done
          exit "$failed"
