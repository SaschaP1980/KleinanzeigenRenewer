name: KAR-171 upstream merge conflict inventory (temporary)
on:
  push:
    branches:
      - work/KAR-171
permissions:
  contents: read
jobs:
  drymerge:
    name: Read-only exact-SHA Git three-way merge inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Git upstream merge conflicts without commit or push
        shell: bash
        env:
          EXPECTED_MAIN: a267caabd53427aa7378be5017787ab32e7c88bd
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN" || {
            echo "Main advanced, abort rather than merge an unreviewed source: $CURRENT_MAIN"
            exit 1
          }
          echo "WORK_HEAD=$(git rev-parse HEAD)"
          echo "MAIN_HEAD=$CURRENT_MAIN"
          echo "MERGE_BASE=$(git merge-base HEAD "$CURRENT_MAIN")"
          set +e
          git -c user.email=kar-ci@example.invalid -c user.name=KAR-CI merge --no-commit --no-ff "$CURRENT_MAIN"
          MERGE_EXIT=$?
          set -e
          echo "MERGE_EXIT=$MERGE_EXIT"
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U
          echo "CONFLICT_FILES_END"
          echo "CONFLICT_DETAILS_BEGIN"
          git ls-files -u | awk '{print $4}' | sort -u
          echo "CONFLICT_DETAILS_END"
          echo "STAGED_SUMMARY_BEGIN"
          git diff --cached --stat | tail -n 65
          echo "STAGED_SUMMARY_END"
          # A conflict is the expected discovered result, not a failed CI run.
          git merge --abort || true
          test "$MERGE_EXIT" -eq 0 || test "$MERGE_EXIT" -eq 1
