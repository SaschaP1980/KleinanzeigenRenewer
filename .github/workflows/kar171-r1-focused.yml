name: KAR-171 R1 focused remote verification (temporary)
on:
  push:
    branches:
      - work/KAR-171
    paths:
      - tests/kar99-phase4-outcome-reconciliation.cjs
      - src/background/services/remote-delete-replacement-service.js
      - src/background/services/phase4-uncertainty-journal.js
      - .github/workflows/kar171-r1-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Independent read-only My Ads source/target verifier and P8 lineage
        run: |
          node tests/kar99-phase4-outcome-reconciliation.cjs
          node --test tests/kar99-p13f2e2d2a-remote-admission-lineage.cjs
      - name: Complete final-tree runtime coverage architecture and no-regression gate
        shell: bash
        run: |
          # This disposable runner is deliberately excluded from the final tree
          # before the repository's strict workflow-owner closure is evaluated.
          rm .github/workflows/kar171-r1-focused.yml
          bash scripts/coverage-gate.sh
