name: KAR-171 R1 focused remote verification (temporary)
on:
  push:
    branches:
      - work/KAR-171
    paths:
      - tests/kar99-phase4-outcome-reconciliation.cjs
      - src/background/services/remote-delete-replacement-service.js
      - .github/workflows/kar171-r1-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent read-only My Ads source/target verifier regression
        run: node tests/kar99-phase4-outcome-reconciliation.cjs
