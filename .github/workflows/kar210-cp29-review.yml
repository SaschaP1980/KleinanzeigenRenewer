name: KAR-210 CP29 validation contract review
on:
  push:
    branches: [work/KAR-210]
    paths: ['.github/workflows/kar210-cp29-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run every adapted contract independently
        shell: bash
        run: |
          failed=0
          for f in tests/v1210-compact-views-message-history.cjs tests/v1211-message-gold-line.cjs tests/v1212-compact-layout-icons.cjs tests/v1213-sticky-retention-interaction.cjs tests/v1214-sticky-goldline.cjs tests/v1217-sticky-target-geometry.cjs tests/v1219-ui-consolidation.cjs tests/v12110-ui-polish.cjs tests/v12111-global-view-sidebar-bottom-diagnostics.cjs tests/v12112-sidebar-refresh-capture-polish.cjs tests/v12113-compact-trash-actions.cjs tests/v12114-ui-copy-consistency.cjs tests/v12115-actions-accordion-recovery.cjs tests/kar210-baseline-retained-behavior.cjs tests/kar210-loading-retention-baseline.cjs tests/kar210-baseline-version-contract.cjs tests/current-patch-policy-regression.cjs tests/kar210-test-disposition-contract.cjs; do
            echo "CP29_BEGIN $f"
            if NODE_OPTIONS='--require ./tests/v12222-vm-legacy-bridge.cjs' node "$f"; then echo "CP29_PASS $f"; else echo "CP29_FAIL $f"; failed=1; fi
          done
          exit "$failed"
